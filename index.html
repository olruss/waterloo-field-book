/* Concept: a surveyor's field book. Drafting-vellum ground, plan-blue ink, title-block spec grids,
   lots drawn to one shared scale, a plat-style map with a kilometre bar. Data in mono, headings in a
   quirky grotesque, text in a plain humanist sans. */
:root {
  --paper: #ECEFEA;      /* drafting vellum with a green cast */
  --sheet: #F8FAF6;      /* surfaces */
  --ink: #15232B;        /* slate ink */
  --ink-2: #4B5B63;      /* secondary text */
  --mute: #8A999E;       /* neutral marks */
  --rule: #C6D0CA;
  --rule-2: #DBE2DC;
  --accent: #1F4E8C;     /* plan blue */
  --accent-soft: #DCE6F3;
  --on-accent: #FFFFFF;
  --good: #17795F;  --good-soft: #D6ECE3;
  --warn: #8F6200;  --warn-soft: #F5E7C4;
  --bad: #A5372A;   --bad-soft: #F3D9D3;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow: 0 18px 50px rgba(21, 35, 43, .22);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0D171D; --sheet: #14212A; --ink: #E3EBE7; --ink-2: #9DAEB5; --mute: #6B7D85;
    --rule: #2A3B45; --rule-2: #1E2D36; --accent: #7DB2F2; --accent-soft: #1A3050; --on-accent: #0D171D;
    --good: #4FC4A2; --good-soft: #123A31; --warn: #E3B24B; --warn-soft: #3B3112;
    --bad: #F0907F; --bad-soft: #471F1A; --shadow: 0 18px 50px rgba(0, 0, 0, .55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0D171D; --sheet: #14212A; --ink: #E3EBE7; --ink-2: #9DAEB5; --mute: #6B7D85;
  --rule: #2A3B45; --rule-2: #1E2D36; --accent: #7DB2F2; --accent-soft: #1A3050; --on-accent: #0D171D;
  --good: #4FC4A2; --good-soft: #123A31; --warn: #E3B24B; --warn-soft: #3B3112;
  --bad: #F0907F; --bad-soft: #471F1A; --shadow: 0 18px 50px rgba(0, 0, 0, .55);
}

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body); }
h1, h2, h3, h4 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -.01em; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.label { font: 500 10.5px/1.2 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.wrap { max-width: 1360px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--rule); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 6px 28px; padding-block: 14px 0; }
.brand h1 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; line-height: 1.05; }
.brand .label { display: block; margin-bottom: 5px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; max-width: 100%; }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font: 500 14px var(--body); color: var(--ink-2); white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { padding-block: 26px 80px; }

/* shared bits */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--rule); border-radius: 3px; font: 500 11.5px/1.5 var(--body); color: var(--ink-2); background: var(--sheet); white-space: nowrap; }
.chip.good { background: var(--good-soft); border-color: transparent; color: var(--good); }
.chip.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.pref { border-color: var(--accent); color: var(--accent); }
.scroll { overflow-x: auto; max-width: 100%; }
.stamp { border: 1.5px solid var(--ink); padding: 8px 6px 6px; text-align: center; min-width: 84px; background: var(--sheet); }
.stamp b { display: block; font: 500 28px/1 var(--mono); }
.stamp span { display: block; margin-top: 4px; font: 500 9.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.stamp.hi { border-color: var(--good); } .stamp.hi b { color: var(--good); }
.stamp.lo { border-color: var(--rule); } .stamp.lo b { color: var(--ink-2); }
.star { background: none; border: 0; padding: 2px 4px; font-size: 17px; line-height: 1; color: var(--mute); }
.star[aria-pressed="true"] { color: var(--accent); }

/* shortlist */
.intro { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 28px 56px; align-items: start; margin-bottom: 30px; }
.intro h2 { font-size: clamp(26px, 3.6vw, 40px); font-weight: 700; line-height: 1.08; }
.intro p { margin: 12px 0 0; color: var(--ink-2); max-width: 58ch; }
.titleblock { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); border: 1.5px solid var(--ink); background: var(--sheet); }
.titleblock > div { padding: 8px 10px 9px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); min-width: 0; }
.titleblock .v { font: 500 15px/1.35 var(--mono); margin-top: 3px; overflow-wrap: anywhere; }
.titleblock .v small { display: block; font: 400 11px/1.3 var(--mono); color: var(--ink-2); }
.patterns { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; margin-bottom: 34px; border-top: 1.5px solid var(--ink); }
.patterns > div { padding: 14px 18px 14px 0; }
.patterns h3 { font-size: 15px; margin-bottom: 4px; }
.patterns p { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.sect { display: flex; align-items: baseline; gap: 14px; margin: 8px 0 12px; }
.sect h3 { font-size: 20px; }
.sect .label { flex: 1; }
.homes { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.home { display: grid; grid-template-columns: 176px minmax(0, 1fr) 190px auto; gap: 8px 22px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 14px 8px 14px 0; }
.home:hover { background: var(--sheet); }
.home .ph { position: relative; aspect-ratio: 16 / 11; background: var(--rule-2); overflow: hidden; }
.home .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.home .rk { position: absolute; left: 0; top: 0; background: var(--ink); color: var(--paper); font: 500 15px/1 var(--mono); padding: 6px 9px 6px 8px; }
.home h4 { font-size: 20px; font-weight: 650; line-height: 1.15; }
.home .sub { margin: 3px 0 7px; font-size: 13px; color: var(--ink-2); }
.home .vd { margin: 0 0 8px; font-size: 13.5px; max-width: 70ch; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font: 400 12.5px/1.35 var(--mono); }
.specs dt { color: var(--ink-2); } .specs dd { margin: 0; text-align: right; }
.specs dd.p { font-weight: 500; font-size: 15px; }

/* all listings */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; margin-bottom: 14px; }
.field { display: grid; gap: 4px; }
.field input[type=search], .field select { font: 14px var(--body); background: var(--sheet); color: var(--ink); border: 1px solid var(--rule); border-radius: 3px; padding: 7px 9px; min-width: 150px; }
.field input[type=range] { accent-color: var(--accent); width: 150px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13.5px; padding-bottom: 6px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.checks input { accent-color: var(--accent); }
.count { margin-left: auto; padding-bottom: 8px; }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; background: var(--sheet); }
.grid th { position: sticky; top: 0; background: var(--sheet); text-align: left; font: 500 10.5px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 9px 10px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; cursor: pointer; user-select: none; }
.grid th[aria-sort] { color: var(--ink); }
.grid td { padding: 8px 10px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
.grid td.r, .grid th.r { text-align: right; }
.grid tbody tr { cursor: pointer; }
.grid tbody tr:hover { background: var(--accent-soft); }
.grid td.addr { white-space: normal; min-width: 170px; font-weight: 500; }
.sc { display: inline-block; min-width: 46px; text-align: center; padding: 1px 6px; border: 1px solid var(--rule); font: 500 13px var(--mono); }
.sc.hi { border-color: var(--good); color: var(--good); } .sc.mid { border-color: var(--accent); color: var(--accent); }
.empty { padding: 40px 0; color: var(--ink-2); }

/* map + market */
.panel { background: var(--sheet); border: 1px solid var(--rule); padding: 16px; }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { background: none; border: 0; padding: 6px 12px; font: 500 12.5px var(--body); border-right: 1px solid var(--rule); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mapbox { position: relative; }
.mapbox svg, .chart svg { display: block; width: 100%; height: auto; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 6px 9px; font: 12px/1.35 var(--mono); max-width: 240px; z-index: 5; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.charts { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); margin-top: 18px; }
.chart h3 { font-size: 17px; margin-bottom: 2px; }
.chart p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); max-width: 60ch; }
svg .gl { stroke: var(--rule-2); stroke-width: 1; }
svg .axl { stroke: var(--ink-2); stroke-width: 1; }
svg text { font: 10.5px var(--mono); fill: var(--ink-2); }
svg text.strong { fill: var(--ink); font-weight: 500; }
svg text.onacc { fill: var(--on-accent); font-weight: 500; text-anchor: middle; }
.d-hi { fill: var(--good); } .d-mid { fill: var(--accent); } .d-lo { fill: var(--mute); }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.dot { cursor: pointer; }

/* report prose */
.prose { max-width: 78ch; }
.prose h1 { font-size: 30px; margin: 0 0 14px; }
.prose h2 { font-size: 22px; margin: 34px 0 10px; padding-top: 18px; border-top: 1.5px solid var(--ink); }
.prose h3 { font-size: 17px; margin: 24px 0 6px; }
.prose p, .prose li { max-width: 74ch; }
.prose table { border-collapse: collapse; font-size: 12.5px; background: var(--sheet); }
.prose th, .prose td { padding: 6px 9px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.prose th { font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
.prose code { font-family: var(--mono); font-size: .9em; }
.prose hr { border: 0; border-top: 1px solid var(--rule); margin: 28px 0; }

/* drawer */
#scrim { position: fixed; inset: 0; background: rgba(10, 18, 23, .45); z-index: 30; }
#drawer { position: fixed; z-index: 31; top: 0; right: 0; bottom: 0; width: min(680px, 100%); background: var(--paper); box-shadow: var(--shadow); overflow-y: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-reduced-motion: no-preference) { #drawer { animation: slide .18s ease-out; } }
@keyframes slide { from { transform: translateX(28px); opacity: .6; } to { transform: none; opacity: 1; } }
.dhead { position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.dbody { padding: 18px 18px 40px; display: grid; gap: 22px; }
.dbody h2 { font-size: clamp(25px, 4vw, 32px); font-weight: 700; line-height: 1.08; }
.dbody .sub { color: var(--ink-2); margin-top: 4px; }
.price { font: 500 26px/1 var(--mono); margin-top: 10px; }
.gal .main { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--rule-2); display: block; }
.gal .strip { display: flex; gap: 4px; margin-top: 4px; overflow-x: auto; }
.gal .strip button { padding: 0; border: 2px solid transparent; background: none; flex: 0 0 auto; }
.gal .strip button[aria-current="true"] { border-color: var(--accent); }
.gal .strip img { width: 74px; height: 54px; object-fit: cover; display: block; }
.gal .cap { margin-top: 5px; }
.dsec h3 { font-size: 17px; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1.5px solid var(--ink); }
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 112px 1fr 38px; gap: 10px; align-items: center; font-size: 13px; }
.bar .tr { height: 8px; background: var(--rule-2); position: relative; }
.bar .tr i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bar.lowv .tr i { background: var(--warn); }
.bar.highv .tr i { background: var(--good); }
.bar .n { font: 500 13px var(--mono); text-align: right; }
.bar small { color: var(--ink-2); font-family: var(--mono); }
.list { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.list.flags li::marker { color: var(--bad); } .list.good li::marker { color: var(--good); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.callout { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; font-size: 14.5px; }
.lot svg { width: 100%; max-width: 420px; height: auto; display: block; }
.lot .lotfill { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
details.fold { border-top: 1px solid var(--rule); padding: 8px 0; }
details.fold summary { cursor: pointer; font-weight: 500; font-size: 14px; }
details.fold[open] summary { margin-bottom: 8px; }
details.fold p { margin: 0; font-size: 14px; color: var(--ink-2); max-width: 66ch; }
.btn { background: var(--ink); color: var(--paper); border: 0; padding: 7px 13px; font: 500 13px var(--body); text-decoration: none; display: inline-block; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--ink); }

.nopics .home { grid-template-columns: 44px minmax(0, 1fr) 190px auto; }
.nopics .home .ph { aspect-ratio: auto; align-self: start; background: none; overflow: visible; }
.nopics .home .rk { position: static; display: inline-block; }
@media (max-width: 980px) {
  .nopics .home { grid-template-columns: 44px minmax(0, 1fr); }
  .intro { grid-template-columns: 1fr; }
  .home { grid-template-columns: 132px minmax(0, 1fr); }
  .home .specs, .home .stamp { grid-column: 1 / -1; }
  .home .specs { grid-template-columns: repeat(auto-fit, minmax(110px, auto)); }
  .home .specs dd { text-align: left; }
  .home .stamp { justify-self: start; }
}
@media (max-width: 520px) {
  .home, .nopics .home { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 92px 1fr 34px; }
}
</style>

nd scored five criteria 0–10: value 25%, condition 20%, layout 20%, location 20% (your five preferred areas score 8–10), risk 15%. Totals are computed by script (<code>analyze_merge.py<\/code>) so weights are identical for every listing.<\/li>\n<li><strong>My review pass:<\/strong> I re-read the full text of the top ~20 against the agents' summaries, fixed errors, re-ranked, and built comps for the final 10 (<code>analyze_top.py<\/code>).<\/li>\n<\/ol>\n<p><strong>Limits you should weigh:<\/strong><\/p>\n<ul>\n<li><strong>Photos reviewed for 12 homes<\/strong> (the top ten plus two others), added after the text ranking: see <a href=\"#\" data-sub=\"photo\">photo_review.md<\/a>. The final order below is the <em>text-based<\/em> one; the <strong>photo-adjusted order is in photo_review.md and supersedes it<\/strong> (Southwick and Mayfield move up; Thornview, Mulberry and Buttercup move down; Royal Fern and Thorncrest enter the top 10 after their photo reviews, and Mulberry and Thorndale leave it). The other 120 properties are scored from text alone.<\/li>\n<li><strong>No sold prices.<\/strong> \"Value\" means cheap relative to other <em>active<\/em> listings, not to what homes sell for. Your agent can pull sold comps; that is the single most useful missing input.<\/li>\n<li><strong>Scores are judgment, not measurement.<\/strong> Batch averages ranged from 58 to 66, partly because batches contained different areas. That is why I re-ranked the top candidates myself rather than trusting raw totals.<\/li>\n<li><strong>\"3+ bedrooms\" is ambiguous in the data.<\/strong> Listings write \"2 + 2\" (above + below grade). I count above-grade bedrooms as the real test. One otherwise strong listing (42 Culpepper Drive) fails it.<\/li>\n<li><strong>$/sqft:<\/strong> I use <strong>above-grade<\/strong> area where available (99 of 132 listings have it); total area includes finished basements and flatters houses with large basements.<\/li>\n<\/ul>\n<h2>Market snapshot (this filtered segment only)<\/h2>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unique properties<\/td>\n<td>132 (187 raw listings)<\/td>\n<\/tr>\n<tr>\n<td>Price<\/td>\n<td>median $724,950; middle half $632k–$834k<\/td>\n<\/tr>\n<tr>\n<td>Days on market<\/td>\n<td>median 25; 39 listed in the last 14 days; 22 over 60 days; 11 over 90 days<\/td>\n<\/tr>\n<tr>\n<td>Condition (agents' read)<\/td>\n<td>41 move-in ready, 73 cosmetic work, 17 moderate work, none major<\/td>\n<\/tr>\n<tr>\n<td>Suites<\/td>\n<td>17 have an existing suite, 23 \"likely\", 62 \"possible\", 30 none<\/td>\n<\/tr>\n<tr>\n<td>Median above-grade price<\/td>\n<td>~$522/sqft overall; Clair Hills $449, Laurelwood $462, Westvale $561, Beechwood $652 (small semis/bungalows)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Read: a fast-moving market for well-presented homes (many 5–15 days old at attractive prices) and a soft tail of stale listings. <strong>No price-change history yet<\/strong>, because this is the first snapshot; rerun weekly and <code>price_history<\/code> starts filling in.<\/p>\n<h2>Text-based top 10 (superseded by the photo-adjusted order in the Photo review tab)<\/h2>\n<p>Order reflects my re-ranking, not raw agent totals (shown for reference).<\/p>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Address<\/th>\n<th>Area<\/th>\n<th>Price<\/th>\n<th>Above-grade / total sqft<\/th>\n<th>Beds/Baths<\/th>\n<th>$/sqft above (area median)<\/th>\n<th>Agent score<\/th>\n<th>Days on mkt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><a href=\"#\" data-l=\"40867843-756-karlsfeld-road\">756 Karlsfeld Rd<\/a><\/td>\n<td>Clair Hills ★<\/td>\n<td>$834,900<\/td>\n<td>2,056 / ~2,600<\/td>\n<td>3+2 / 4<\/td>\n<td>406 (449)<\/td>\n<td>84.0<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><a href=\"#\" data-l=\"40862303-424-sauve-crescent\">424 Sauve Cres<\/a><\/td>\n<td>Clair Hills ★<\/td>\n<td>$899,900<\/td>\n<td>2,143 / 3,055<\/td>\n<td>4 / 3<\/td>\n<td>420 (449)<\/td>\n<td>82.5<\/td>\n<td>25<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><a href=\"#\" data-l=\"40862943-588-drummerhill-crescent\">588 Drummerhill Cres<\/a><\/td>\n<td>Westvale ★<\/td>\n<td>$629,000<\/td>\n<td>1,330 / 1,898<\/td>\n<td>3 / 2<\/td>\n<td>473 (561)<\/td>\n<td>78.0<\/td>\n<td>21<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><a href=\"#\" data-l=\"40865289-526-thornview-place\">526 Thornview Pl<\/a><\/td>\n<td>Laurelwood ★<\/td>\n<td>$699,900<\/td>\n<td>1,711 / 2,331<\/td>\n<td>3 / 3<\/td>\n<td>409 (462)<\/td>\n<td>76.5<\/td>\n<td>13<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td><a href=\"#\" data-l=\"40865846-416-speckled-alder-street\">416 Speckled Alder St<\/a><\/td>\n<td>Columbia Hills (borders Clair Hills)<\/td>\n<td>$725,000<\/td>\n<td>1,723 / 2,471<\/td>\n<td>4+1 / 4<\/td>\n<td>421 (452)<\/td>\n<td>82.5<\/td>\n<td>11<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td><a href=\"#\" data-l=\"40863090-177-mayfield-avenue\">177 Mayfield Ave<\/a><\/td>\n<td>Willowdale<\/td>\n<td>$799,900<\/td>\n<td>1,841 / 2,691<\/td>\n<td>3 / 4<\/td>\n<td>434 (563)<\/td>\n<td>77.0<\/td>\n<td>16<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td><a href=\"#\" data-l=\"40861359-31-mulberry-lane\">31 Mulberry Ln<\/a><\/td>\n<td>Beechwood ★<\/td>\n<td>$699,900<\/td>\n<td>1,133 / 2,233<\/td>\n<td>3+3 / 2<\/td>\n<td>618 (652)<\/td>\n<td>77.5<\/td>\n<td>27<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td><a href=\"#\" data-l=\"40868031-13-southwick-place\">13 Southwick Pl<\/a><\/td>\n<td>Lincoln<\/td>\n<td>$899,900<\/td>\n<td>1,626 / 2,344<\/td>\n<td>4 / 2<\/td>\n<td>553 (553)<\/td>\n<td>78.0<\/td>\n<td>5<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><a href=\"#\" data-l=\"40866171-206-buttercup-court\">206 Buttercup Ct<\/a><\/td>\n<td>Columbia Hills<\/td>\n<td>$599,900<\/td>\n<td>1,494 / 2,279<\/td>\n<td>3+1 / 3<\/td>\n<td>402 (452)<\/td>\n<td>76.5<\/td>\n<td>12<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><a href=\"#\" data-l=\"40863453-512-thorndale-drive\">512 Thorndale Dr<\/a><\/td>\n<td>Westvale ★<\/td>\n<td>$729,900<\/td>\n<td>1,135 / 2,144<\/td>\n<td>3+2 / 2<\/td>\n<td>643 (561)<\/td>\n<td>71.5<\/td>\n<td>12<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>★ = one of your preferred areas. Where I moved things versus raw scores: 416 Speckled Alder drops (narrow 28 ft lot, small kitchen, not in a preferred area); Drummerhill and Thornview rise (preferred areas, verified value); Thorndale enters from #22 on its in-law/mortgage-helper layout in Westvale.<\/p>\n<hr />\n<h2>1. 756 Karlsfeld Road — Clair Hills — $834,900<\/h2>\n<p><strong>Verdict: the best overall fit. Move first.<\/strong><\/p>\n<ul>\n<li><strong>Space and layout:<\/strong> 2,056 sqft above grade, ~2,600 finished. Five bedrooms: primary 17'2\" × 14'4\" on the second level with ensuite, two more upstairs, plus two below grade (basement and lower level) with a 3-pc bath. Four baths. 15-ft living room ceiling.<\/li>\n<li><strong>Condition (all stated by the seller):<\/strong> shingles and furnace 2020, water heater 2022, A/C and select windows 2023, painted 2026, renovated kitchen (quartz, hardwood), renovated bathrooms. No rental equipment listed.<\/li>\n<li><strong>Setting:<\/strong> backs onto conservation/green belt, 34 × 135 ft fenced yard with two decks, attached garage with 4 parking spaces, in the Laurel Heights Secondary catchment.<\/li>\n<li><strong>Numbers:<\/strong> $406/sqft above grade vs Clair Hills median $449; cheaper than ~90% of listings with area data. Taxes $5,973 (area median $5,529, about $498/month).<\/li>\n<li><strong>Risks and questions:<\/strong> three-storey layout means a lot of stairs. The lower level has no stated kitchen or separate entrance, so a rental suite would be a conversion project. Which windows were replaced in 2023? Listed only 6 days and well priced: expect competition and possibly an offer date.<\/li>\n<li><strong>Compare with:<\/strong> #2 Sauve (the same area, bigger, but $65k more and at your cap).<\/li>\n<\/ul>\n<h2>2. 424 Sauve Crescent — Clair Hills — $899,900<\/h2>\n<p><strong>Verdict: the most house for a family in a top-tier area, but you are at the ceiling.<\/strong><\/p>\n<ul>\n<li><strong>Space:<\/strong> four bedrooms all upstairs. Primary 18'5\" × 14'3\" with a 5-pc ensuite renovated 2021. 2,143 sqft above grade plus a 912 sqft basement finished 2018 (25'4\" × 28'11\" rec room, bathroom rough-in). Floor plan PDF is in the listing folder.<\/li>\n<li><strong>Location:<\/strong> steps from Edna Staebler PS, near Laurel Heights SS.<\/li>\n<li><strong>Numbers:<\/strong> $420/sqft above grade vs median $449. The \"$295/sqft\" the agent quoted counts the basement; on above-grade space the discount is real but modest. Taxes $6,087 (above the area median).<\/li>\n<li><strong>Risks:<\/strong> price is at your $900k limit, so there is no headroom for inspection findings or closing costs. Roof, furnace and window ages are not stated. Water heater is a rental. Lot is 36 × 118 ft.<\/li>\n<\/ul>\n<h2>3. 588 Drummerhill Crescent — Westvale — $629,000<\/h2>\n<p><strong>Verdict: best value in a preferred area, and it leaves ~$270k of headroom.<\/strong><\/p>\n<ul>\n<li><strong>Space:<\/strong> 1,330 sqft above grade plus a 568 sqft finished basement, three bedrooms (primary 15'7\" × 14'1\"), two full baths, attached garage, 54 × 99 ft corner lot backing green belt.<\/li>\n<li><strong>Condition:<\/strong> roof 2021, A/C 2026, sump pump 2026, water heater owned (no rental equipment).<\/li>\n<li><strong>Numbers:<\/strong> $473/sqft above grade vs Westvale median $561. Taxes $3,973, about 19% below the area median. <strong>Direct comp:<\/strong> 543 Drummerhill at $649,900 has only 1,108 sqft above grade; 588 gives you 222 more sqft for $20,900 less.<\/li>\n<li><strong>Trade-offs:<\/strong> only 3 bedrooms and 2 baths, no suite feature, a small 9'9\" × 11'11\" kitchen, and furnace/window ages not stated. Choose it if you want to renovate or save rather than maximise size.<\/li>\n<\/ul>\n<h2>4. 526 Thornview Place — Laurelwood — $699,900<\/h2>\n<p><strong>Verdict: solid family house on a quiet court in a preferred area.<\/strong><\/p>\n<ul>\n<li><strong>Space:<\/strong> 1,711 sqft above grade plus a 620 sqft finished basement, three bedrooms, 2.5 baths, single attached garage, 33 × 107 ft court lot.<\/li>\n<li><strong>Numbers:<\/strong> $409/sqft above grade vs Laurelwood median $462 (cheaper than ~89% of listings with data). Taxes $5,521, in line with the area. <strong>Comp:<\/strong> 537 Havendale Place ($899,000, 1,750 sqft above grade, quartz kitchen, bigger lot) costs $199k more for almost identical above-grade space.<\/li>\n<li><strong>Weaknesses:<\/strong> the listing is \"immaculate, freshly painted\" but states no kitchen, bath or system years, so condition is the main unknown. The basement is a rec room only, with no suite potential. Small lot.<\/li>\n<li><strong>To verify:<\/strong> furnace, roof and A/C ages; whether the kitchen is original. Confidence is medium.<\/li>\n<\/ul>\n<h2>5. 416 Speckled Alder Street — Columbia Hills — $725,000<\/h2>\n<p><strong>Verdict: striking price for what is on offer. Verify why.<\/strong><\/p>\n<ul>\n<li><strong>Space and condition:<\/strong> 4 bedrooms upstairs plus a fifth in the basement (17'1\" × 10'1\") and a 4-pc bath; 1,723 sqft above grade, 2,471 total. Kitchen, flooring, hood, fridge, stove and dishwasher all 2026; furnace 2022.<\/li>\n<li><strong>Numbers:<\/strong> $421/sqft above grade vs area median $452. <strong>The telling comp is next door:<\/strong> 425 Speckled Alder is nearly the same house (1,742 sqft above grade, 4+1 beds, 28 × 98 ft, painted, deck 2022) listed at <strong>$899,900 and unsold after 47 days<\/strong>, $174,900 above 416 for 19 more sqft. Either 416 is priced to draw multiple offers, or 425 is overpriced. Do not read 416 as proof that the area is cheap.<\/li>\n<li><strong>Weaknesses:<\/strong> 28 ft frontage, a small 10'4\" × 10'9\" kitchen, rental water heater, and the 2026 refresh may cover older roof or windows.<\/li>\n<li><strong>Location note:<\/strong> the listing calls the area \"Columbia Forest/Clair Hills\". It is not in your list but borders it.<\/li>\n<\/ul>\n<h2>6. 177 Mayfield Avenue — Willowdale — $799,900<\/h2>\n<p><strong>Verdict: the best deal outside your preferred areas.<\/strong><\/p>\n<ul>\n<li><strong>Space:<\/strong> two-storey, 1,841 sqft above grade plus an 850 sqft finished basement, 3 bedrooms, 4 baths (2 partial), double garage, 75 ft frontage.<\/li>\n<li><strong>Condition:<\/strong> furnace and heat pump 2025, new flooring 2025, both showers updated 2024, kitchen counter and paint 2025–26, washer/dryer 2024, gutters 2024.<\/li>\n<li><strong>Numbers:<\/strong> $434/sqft above grade vs Willowdale median $563 (cheaper than ~81% of listings with data). Taxes $5,877, about 21% above the area median. Comp: 113 Macgregor Cres, $750,000, 1,640 sqft, 457/sqft.<\/li>\n<li><strong>Flags:<\/strong> the text says \"owned tankless water heater\" but the data lists a rental water heater; resolve that. Roof and windows are unstated. The data shows a garbled bedroom size (10' × 112'). The lot size is blank.<\/li>\n<\/ul>\n<h2>7. 31 Mulberry Lane — Beechwood — $699,900<\/h2>\n<p><strong>Verdict: the best suite play in a preferred area, with real caveats.<\/strong><\/p>\n<ul>\n<li><strong>Layout:<\/strong> bungalow with 3 bedrooms (1,133 sqft) upstairs and a full lower suite (1,100 sqft): kitchen, living room, 3 bedrooms, 3-pc bath, separate entrance. Corner lot 60 × 111 ft on a ravine, detached garage.<\/li>\n<li><strong>Systems:<\/strong> furnace and heat pump A/C 2024, attic insulation 2022, <strong>roof 2011 (about 15 years old, due for replacement soon)<\/strong>. Rental water heater.<\/li>\n<li><strong>Numbers:<\/strong> $313/sqft on total area vs the Beechwood median $353, but above-grade $/sqft is high ($618). The price is justified by the suite, not the main floor. Taxes $4,643, at the area median.<\/li>\n<li><strong>The twin listing matters:<\/strong> a second MLS entry for the same house (40861414) says \"licensed for 6 students (3 up, 3 down)\", \"vacant possession effective October 1st\", and \"great investment property\". That suggests a licensed student rental. Good news: the suite has city standing. Risks: student-tenant wear, and the licence is a lodging licence, not proof of a fire-code-compliant secondary unit. Ask for the licence, inspection history and the electrical/egress documents.<\/li>\n<\/ul>\n<h2>8. 13 Southwick Place — Lincoln — $899,900<\/h2>\n<p><strong>Verdict: the lot is the product. Worth it only if you value land.<\/strong><\/p>\n<ul>\n<li><strong>Lot:<\/strong> 0.395-acre pie lot, 55 ft frontage tapering to 218 ft deep, cul-de-sac, backs conservation/green belt, double garage, parking for 6. The listing calls it rare.<\/li>\n<li><strong>House:<\/strong> renovated sidesplit, 1,626 sqft above grade (2,344 total), 4 bedrooms (one on the main floor), quartz kitchen with island, engineered hardwood, \"significant electrical and mechanical improvements\" (unspecified), 2 baths plus a 2-pc. Floor plan PDF is in the folder.<\/li>\n<li><strong>Numbers:<\/strong> $553/sqft above grade, exactly the Lincoln median, so you are not getting a discount on the house; you pay for the land. Taxes $5,471 vs area median $3,726 (about 47% higher).<\/li>\n<li><strong>Risks:<\/strong> at your $900k cap, only 2 full baths, and no suite plan. Ask for the specifics of the electrical and mechanical work and the permits.<\/li>\n<li><strong>Not in a preferred area.<\/strong><\/li>\n<\/ul>\n<h2>9. 206 Buttercup Court — Columbia Hills — $599,900<\/h2>\n<p><strong>Verdict: the cheapest of the ten with a fully refreshed interior, but a compromised house.<\/strong><\/p>\n<ul>\n<li><strong>Condition:<\/strong> kitchen fully renovated 2026 (new cabinets, quartz), all three bathrooms updated 2026, fresh paint and appliances 2026, carpet-free, main-floor office.<\/li>\n<li><strong>Space:<\/strong> 1,494 sqft above grade plus 785 sqft below (partially finished), 3+1 bedrooms, 3 baths (primary with ensuite and walk-in).<\/li>\n<li><strong>Numbers:<\/strong> $402/sqft above grade vs Columbia Hills median $452 (cheaper than ~92% of listings with data). Taxes $4,497, at the area median.<\/li>\n<li><strong>Compromises:<\/strong> semi-detached, only 25 ft frontage on a split-level layout, basement partly finished, and no system ages stated. This is a choice if you value price and a fresh interior over lot and privacy. It also leaves about $300k of headroom.<\/li>\n<\/ul>\n<h2>10. 512 Thorndale Drive — Westvale — $729,900<\/h2>\n<p><strong>Verdict: purpose-built mortgage-helper bungalow, but weak as a pure live-in.<\/strong><\/p>\n<ul>\n<li><strong>Layout:<\/strong> the description says 3 bedrooms on the main floor plus a <strong>walk-out lower apartment<\/strong> with its own entrance, a full kitchen, 2 bedrooms, a bathroom and laundry. The structured data lists \"2+3\" bedrooms, so confirm the real layout. Main floor has in-suite laundry too. Double garage, 45 × 115 ft lot.<\/li>\n<li><strong>Numbers:<\/strong> $643/sqft above grade (1,135 sqft) is expensive against the Westvale median $561; the value is in the second unit, not the main floor. Taxes $4,926, at the median.<\/li>\n<li><strong>Risks:<\/strong> whether the lower unit is legal/registered is not stated, and condition and update years are not described. The water heater is a rental.<\/li>\n<li><strong>Fit:<\/strong> strongest if you intend to rent the lower unit. Weak if you want a larger main house.<\/li>\n<\/ul>\n<hr />\n<h2>Next up (not top 10, still worth a look)<\/h2>\n<ul>\n<li><strong>292 Thorncrest Dr<\/strong> <em>(now in the top 10 after its photo review)<\/em> (Lakeshore, $899,900): <em>legal<\/em> second dwelling (2023, 2 bed, kitchen, separate entrance) plus a new kitchen (June 2026) on a 66 × 114 ft lot. Strongest legal-suite story of all, but at the cap, with taxes of $7,920 and a rental water heater. Not a preferred area.<\/li>\n<li><strong>608 Royal Fern St<\/strong> <em>(now in the top 10 after its photo review)<\/em> (Columbia Hills, $699,000): detached cul-de-sac house with no rental equipment, furnace and A/C 2022, roof 2015, basement 2023, bathrooms 2026.<\/li>\n<li><strong>364 Stoneheight Pl<\/strong> (Lakeshore North, $875,000): ~1,000 sqft addition, basement with kitchen, pool. Needs permit checks; taxes $7,510.<\/li>\n<li><strong>188 Pineland Ct<\/strong> (Laurelwood, $725,000): new listing, new ensuite and kitchen counters, 3 bed / 4 bath. Size is only given as a range (1,500–2,000), so value can't be checked.<\/li>\n<li><strong>548 Mariner Dr<\/strong> (Eastbridge, $639,000): park-backing end-unit townhouse; the cheapest way into your Eastbridge preference.<\/li>\n<li><strong>601 Pinerow Cres Unit A<\/strong> (Beechwood West, $669,800): roof 2025 and a separate basement entrance, but a 30 ft semi priced at the area median.<\/li>\n<\/ul>\n<p><strong>Excluded despite a decent score:<\/strong> 42 Culpepper Dr (Beechwood, $899,900, 173 days). The listing says it was converted from 3+2 to 2+2 bedrooms, so it has only 2 above grade.<\/p>\n<h2>Suggested next steps<\/h2>\n<ol>\n<li><strong>Done for 12 homes<\/strong> (see photo_review.md).<\/li>\n<li><strong>Ask your agent for sold comps<\/strong> within about 6 months in Clair Hills, Westvale, Laurelwood and Beechwood. That turns \"cheap vs other active listings\" into an actual offer range.<\/li>\n<li><strong>Treat the photo review as a first pass.<\/strong> It confirms finishes, not roof, wiring or foundation; condition the offer on a full inspection.<\/li>\n<li><strong>Rerun the scraper weekly.<\/strong> After a few weeks, price drops and disappearances show which listings the market rejects.<\/li>\n<\/ol>","photoHtml":"<h1>Photo review<\/h1>\n<p>Twelve agents each viewed 23–45 photos (all of them when ≤ 30, otherwise an even spread of ~30–40) and compared them with the seller's text. Raw findings: <code>analysis/photos/&lt;mls&gt;.json<\/code>.<\/p>\n<p><strong>Read these with some caution:<\/strong><\/p>\n<ul>\n<li>Photos show finishes and wear. They do <strong>not<\/strong> show roof age, furnace, wiring, plumbing or foundation condition. Every home still needs a proper inspection.<\/li>\n<li>Reviewers cite photo numbers (<code>13.jpg<\/code>), but one reviewer (Buttercup) said its numbers are approximate. Treat citations as pointers to a region of the gallery, not exact frames.<\/li>\n<li>Some listing photos are virtually staged (Thornview, Mayfield); real rooms may look emptier.<\/li>\n<li>Each home was reviewed by one agent, so there is no cross-check on any single judgment. The patterns across homes are more reliable than any single call.<\/li>\n<\/ul>\n<h2>What changed<\/h2>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th>Text-based #<\/th>\n<th>Home<\/th>\n<th>Photo adj.<\/th>\n<th>Photo-based condition*<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>756 Karlsfeld<\/td>\n<td>−1<\/td>\n<td>6/10<\/td>\n<td>\"Renovated\" is mostly a surface refresh. Still #1, narrowly.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>424 Sauve<\/td>\n<td>+1<\/td>\n<td>8/10<\/td>\n<td>Real upgrades confirmed. The most solid house of the ten.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>588 Drummerhill<\/td>\n<td>0<\/td>\n<td>6/10<\/td>\n<td>Matches text, but dehumidifier plus a 2026 sump pump point to a damp-basement question.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>526 Thornview<\/td>\n<td>0<\/td>\n<td>6/10<\/td>\n<td>Most dated of the top 10 (2002 builder-grade). Drops.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>416 Speckled Alder<\/td>\n<td>0<\/td>\n<td>7/10<\/td>\n<td>Surface refresh; basement bedroom likely non-egress. Drops a little.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>177 Mayfield<\/td>\n<td>0<\/td>\n<td>6.5/10<\/td>\n<td>Honest listing. Moves up.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>31 Mulberry<\/td>\n<td>−1<\/td>\n<td>5/10<\/td>\n<td><strong>No photo of the suite at all<\/strong> and a deteriorating stairwell. Drops.<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>13 Southwick<\/td>\n<td>+1<\/td>\n<td>7/10<\/td>\n<td>Updates and the lot are real. Moves up.<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>206 Buttercup<\/td>\n<td>0<\/td>\n<td>6/10<\/td>\n<td>Moisture marks in the basement; weathered deck.<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>512 Thorndale<\/td>\n<td>−1<\/td>\n<td>5/10<\/td>\n<td>Lower unit looks illegal/unsafe as built. Drops out of the top 10 once two more homes are reviewed.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>*Reviewer's overall-condition rating, 0–10.<\/p>\n<h2>Final order after reviewing 12 homes<\/h2>\n<p>Two more homes were reviewed after the first ten: <strong>608 Royal Fern<\/strong> and <strong>292 Thorncrest<\/strong>. Both have better-verified condition than Mulberry and Thorndale, so they replace them in the top 10. Mulberry and Thorndale stay on the list as suite projects.<\/p>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Home<\/th>\n<th>Price<\/th>\n<th>Why it sits here<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>756 Karlsfeld Rd (Clair Hills ★)<\/td>\n<td>$834.9k<\/td>\n<td>Cheapest of the strong candidates and leaves $65k of headroom for the cosmetic refresh the photos say it needs. Close call with #2.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>424 Sauve Cres (Clair Hills ★)<\/td>\n<td>$899.9k<\/td>\n<td>Best-condition house, but at your cap with a dated kitchen and main bath. If you would rather pay for condition than refresh later, it is #1.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>588 Drummerhill Cres (Westvale ★)<\/td>\n<td>$629k<\/td>\n<td>Preferred area, huge headroom, but investigate the basement moisture question first.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>13 Southwick Pl (Lincoln)<\/td>\n<td>$899.9k<\/td>\n<td>Genuinely updated kitchen and exterior, private 0.395-acre lot. Not a preferred area; at your cap.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>177 Mayfield Ave (Willowdale)<\/td>\n<td>$799.9k<\/td>\n<td>Baths and floors really were done; basement and deck are original. Nothing misrepresented.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>416 Speckled Alder St (Columbia Hills)<\/td>\n<td>$725k<\/td>\n<td>Most space for the money in this group, but a surface refresh on a tight lot; check the basement bedroom egress.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>608 Royal Fern St (Columbia Hills)<\/td>\n<td>$699k<\/td>\n<td>New. Photos match the text: kitchen, both baths and basement are genuinely refreshed, no rental equipment. Compact rooms and a tight lot.<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>292 Thorncrest Dr (Lakeshore)<\/td>\n<td>$899.9k<\/td>\n<td>New. Strong main floor, new kitchen and a private 66 × 114 ft lot. The \"legal\" suite looks basic and its bedroom window does not look egress-sized. At your cap, high taxes.<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>526 Thornview Pl (Laurelwood ★)<\/td>\n<td>$699.9k<\/td>\n<td>Clean but the most dated; priced $200k under a comparable Laurelwood home for a reason.<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>206 Buttercup Ct (Columbia Hills)<\/td>\n<td>$599.9k<\/td>\n<td>Cheap and fresh inside, with moisture marks, a weathered deck and a power line over the yard.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Also considered, as suite projects:<\/strong> 31 Mulberry Ln (Beechwood ★, $699.9k): the suite has not been photographed, so the case rests on an unseen basement. 512 Thorndale Dr (Westvale ★, $729.9k): the lower unit looks like it would need work to be legal.<\/p>\n<h2>Home by home<\/h2>\n<h3>756 Karlsfeld Road (adj. −1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> bright 15-ft living room, new quartz counters and backsplash, fresh paint, and a fully modernised lower-level ensuite.<\/li>\n<li><strong>Not as described:<\/strong> \"renovated kitchen and bathrooms\" is a surface refresh. Honey-oak cabinets with a chipped end panel, an oak island with corbels, beige 2004-era tile, a jetted corner tub and brass hardware remain. The deck is freshly painted solid red, which can hide rot.<\/li>\n<li><strong>Layout flag:<\/strong> the reviewer's read of the floor plan suggests the \"two bedrooms below grade\" may be one bedroom plus an office, with the rest utility and storage. Confirm the real bedroom count (it is still at least 4).<\/li>\n<li><strong>Not visible:<\/strong> roof, furnace, A/C, water heater, utility room.<\/li>\n<li><strong>Inspect:<\/strong> deck ledger and footings under the paint; sump and window wells; roof granule loss.<\/li>\n<\/ul>\n<h3>424 Sauve Crescent (adj. +1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the 2021 ensuite (freestanding tub, double vanity, tiled walk-in shower) and the 2018 basement with a gas fireplace.<\/li>\n<li><strong>Not as described:<\/strong> \"nothing left to do\" overstates it. Kitchen (oak cabinets, laminate-look counters), main bath and stipple ceilings are 2007 builder-era. Side yards are narrow with neighbours' walls a few feet away. A hot tub sits on the deck.<\/li>\n<li><strong>Not visible:<\/strong> laundry, mechanicals, roof, the bathroom rough-in in the basement.<\/li>\n<li><strong>Inspect:<\/strong> hot tub electrical and deck footings; roof; basement drainage and ceiling height under the bulkheads.<\/li>\n<\/ul>\n<h3>588 Drummerhill Crescent (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> clean, fresh paint and carpet, glossy hardwood, roof looks even from the aerial shot.<\/li>\n<li><strong>Not as described:<\/strong> \"modern living\" and \"private backyard oasis\". The kitchen and both baths are early-2000s (maple cabinets, white appliances, a jetted tub). The yard is small and overlooked, with a neighbour's pool right behind.<\/li>\n<li><strong>Moisture flag:<\/strong> a portable dehumidifier is running in the basement, the ceiling is low with bulkheads, and the sump pump was replaced in 2026. Ask the seller why.<\/li>\n<li><strong>Inspect:<\/strong> foundation walls and the floor/wall joint, sump discharge and backup, A/C and furnace.<\/li>\n<\/ul>\n<h3>13 Southwick Place (adj. +1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the updated kitchen, lighting, exterior and rec room, and a private treed lot.<\/li>\n<li><strong>Not as described:<\/strong> \"extensively renovated … updated flooring\" is uneven. Bedrooms have a mix of old strip oak, parquet and laminate; one bedroom still has wood-panel walls and parquet. The bathroom is basic, the range is a plain electric, and a neighbour's pool sits close on one side with chain-link fencing.<\/li>\n<li><strong>Not shown:<\/strong> the mechanicals, laundry and 2-pc bath behind the \"significant electrical and mechanical improvements\" claim.<\/li>\n<li><strong>Inspect:<\/strong> panel and wiring (a 1967 build), furnace and A/C, roof, basement walls behind the wainscot.<\/li>\n<\/ul>\n<h3>177 Mayfield Avenue (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> frameless walk-in shower with large-format tile in the ensuite, a new quartz vanity in the second bath, new counters and stove.<\/li>\n<li><strong>Not as described:<\/strong> the kitchen is painted original cabinets with new counters and mixed white and stainless appliances. The basement, deck and trim are still 1990s (pine trim, brass fixtures, carpet, drop ceiling). Some rooms look virtually staged. Stipple ceilings remain.<\/li>\n<li><strong>Inspect:<\/strong> the water heater question (the listing says both owned and rental), furnace/heat pump records, deck structure, basement moisture.<\/li>\n<\/ul>\n<h3>416 Speckled Alder Street (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the clean 2026 kitchen refresh with new appliances, and fresh paint and flooring.<\/li>\n<li><strong>Not as described:<\/strong> \"extensively refreshed\" is surface-level. The original dark tile floor continues through the kitchen, ceilings are stipple, vanities are the original cherry, and the flooring is patchwork. The countertops may be laminate or solid surface rather than quartz. Neighbours are 6–8 ft away.<\/li>\n<li><strong>Safety/legality flag:<\/strong> the basement \"bedroom\" has a single small high window that probably is not an egress window, so it may not legally count as a bedroom.<\/li>\n<li><strong>Inspect:<\/strong> roof, the claimed 2022 furnace, foundation behind the fresh finishes.<\/li>\n<\/ul>\n<h3>608 Royal Fern Street (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the kitchen, both renovated bathrooms and the basement (pot lights, new corner shower) look genuinely refreshed. The utility room is tidy (Carrier A/C, Infiniti furnace; install dates not legible). No visible water stains, cracks or mould.<\/li>\n<li><strong>Not as described:<\/strong> the \"open-concept\" main floor is compact (kitchen 12' × 8'7\", dining 10'4\" × 7'2\", separated by a pass-through). Stipple ceilings remain, the upstairs floors are dark laminate rather than hardwood, two bedrooms are narrow, and kitchen cabinets are painted rather than replaced. The basement \"potential fourth bedroom\" has one small high window. Several photos look AI-enhanced or are marketing graphics.<\/li>\n<li><strong>Inspect:<\/strong> roof (2015 claimed), furnace and A/C (2022 claimed), basement permits and egress, waterproofing in the 2026 bathrooms.<\/li>\n<\/ul>\n<h3>292 Thorncrest Drive (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the new June 2026 kitchen, hardwood floors, and a mature treed, private yard with a good deck and strong curb appeal.<\/li>\n<li><strong>Not as described:<\/strong> the stair and spindles are original orange-toned oak and brass closet knobs remain. The basement suite called \"professionally finished\" with $100k invested reads as basic: textured ceilings, dark counters, laminate floors, scuffed walls, and no laundry visible in any lower-level photo. The listing mentions a gas fireplace but the spec says electric.<\/li>\n<li><strong>Suite flags:<\/strong> the lower bedroom window is small, high and faces a window well, so it does not look egress-sized. Ceilings have bulkheads and the living area has one small window. A suite called legal still needs the city registration, permits and fire-separation records.<\/li>\n<li><strong>Inspect:<\/strong> the roof; rental water heater and softener contracts; sump and basement walls; permits for the 2023 basement and 2026 kitchen.<\/li>\n<\/ul>\n<h3>526 Thornview Place (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> clean, freshly painted, large primary suite with a fireplace, and a good basement bathroom. No visible damage.<\/li>\n<li><strong>Not as described:<\/strong> the listing does not claim a renovation, and the photos confirm 2002 builder-grade throughout: laminate counters, white thermofoil cabinets, a basic coil-top range, beige tile, wall-to-wall carpet, stipple ceilings. Several photos are virtually staged. The deck is weathered, and the yard is narrow.<\/li>\n<li><strong>Watch:<\/strong> dark spots on the basement carpet. Check for moisture.<\/li>\n<li><strong>Read:<\/strong> this is why it is $200k below a comparable Laurelwood listing. You would be buying a house that needs a kitchen and baths soon.<\/li>\n<\/ul>\n<h3>206 Buttercup Court (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the 2026 kitchen and baths look clean and new (quartz-look tops, new vanities, stainless appliances).<\/li>\n<li><strong>Not as described:<\/strong> the original beige tile floors remain, the ensuite shower is dated, and the range is a basic coil-top. The unfinished basement has exposed joists and ducts.<\/li>\n<li><strong>Moisture flag:<\/strong> a horizontal tide line on the concrete walls and a rust-stained floor drain near the furnace. Deck boards are weathered with a lifted board; an overhead hydro line crosses the yard; fences on both sides.<\/li>\n<li><strong>Inspect:<\/strong> the basement near the furnace, deck, and permits for the 2026 kitchen and bath work.<\/li>\n<\/ul>\n<h3>31 Mulberry Lane (adj. −1) — the one to be most sceptical about<\/h3>\n<ul>\n<li><strong>Biggest gap:<\/strong> none of the 45 photos show the basement suite, which is the reason to buy this house.<\/li>\n<li><strong>Visible problems:<\/strong> the basement walk-up stairwell has cracked and patched concrete, moss and rotted wood; a front basement window is covered in plastic sheeting; the main kitchen is original oak and laminate with checkerboard vinyl; ceilings are stipple; the floor plan the reviewer read suggests the lower \"3 bedrooms\" may include a study.<\/li>\n<li><strong>Positive:<\/strong> large treed corner lot, a big deck, a clean neutral main floor, a partly refreshed bathroom.<\/li>\n<li><strong>Before any offer:<\/strong> see the suite in person, with the city rental licence, egress windows, ceiling height, fire separation and moisture. The twin listing's \"licensed for 6 students\" and \"vacant October 1\" make wear likely.<\/li>\n<\/ul>\n<h3>512 Thorndale Drive (adj. −1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> clean and freshly painted, no water marks or mould. The lower level has new plank flooring and a bright rec room that walks out through a slider.<\/li>\n<li><strong>Not as described, and the main concern:<\/strong> the floor plans show an open interior stair from the main floor straight down into the lower level, with no fire-separated door apparent; the lower \"well sized kitchen\" is a small laminate kitchenette; one lower bedroom has only a tiny high window that looks non-egress. The main-floor bedrooms are small (two are about 9' × 12' and 10' × 8').<\/li>\n<li><strong>Read:<\/strong> as built it probably would not qualify as a legal second unit without work. Treat the \"mortgage helper\" as a project, and verify city registration before paying for it.<\/li>\n<\/ul>\n<h2>Cross-cutting patterns<\/h2>\n<ol>\n<li><strong>Most of the ten are 2002–2007 builder-grade houses with a 2026 surface refresh.<\/strong> Stipple ceilings, brass hardware, oak cabinets and beige tile appear in almost all of them. Sellers say \"renovated\" for new counters, paint and appliances; read those words as \"refreshed\".<\/li>\n<li><strong>Possible moisture<\/strong> in three homes: Drummerhill (dehumidifier, replaced sump pump), Buttercup (tide line, rust-stained drain), Thornview (dark spots on basement carpet). Ask all three for sump and basement history.<\/li>\n<li><strong>Legal bedrooms and suites are weak.<\/strong> Speckled Alder's and Thorndale's lower bedrooms look non-egress, and Thorndale's and Mulberry's suites are unverified. Don't pay a suite premium without city registration.<\/li>\n<li><strong>Decks<\/strong> were weathered or painted over in at least four homes (Karlsfeld, Thornview, Buttercup, Mulberry). Budget for deck repair or replacement.<\/li>\n<li><strong>Nothing here shows a deal-breaker defect<\/strong>, but the photos cannot show roof, wiring, plumbing or foundation condition. Make every offer conditional on a full inspection.<\/li>\n<\/ol>"}</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("data").textContent);
  var L = D.listings, M = D.meta;
  var byId = new Map(L.map(function (x) { return [x.id, x]; }));
  var WEIGHTS = { value: 25, condition: 20, layout: 20, location: 20, risk: 15 };
  var NAMES = { value: "Value", condition: "Condition", layout: "Layout", location: "Location", risk: "Risk (10 = low)" };
  var RENO = { none: "Move-in ready", cosmetic: "Cosmetic work", moderate: "Moderate work", major: "Major work", unknown: "Condition unknown" };
  var SUITE = { existing: "Suite in place", likely: "Suite likely", possible: "Suite possible" };

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return n == null ? "–" : "$" + Math.round(n).toLocaleString("en-CA"); };
  var kfmt = function (n) { return n == null ? "–" : "$" + (n / 1000).toFixed(n % 1000 === 0 ? 0 : 1) + "k"; };
  var num = function (n, d) { return n == null ? "–" : Number(n).toLocaleString("en-CA", { maximumFractionDigits: d || 0 }); };
  var med = function (a) { a = a.filter(function (v) { return v != null; }).sort(function (x, y) { return x - y; }); if (!a.length) return null; var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  var score = function (x) { return x.adjTotal != null ? x.adjTotal : x.total; };
  var band = function (t) { return t >= 78 ? "hi" : t >= 70 ? "mid" : "lo"; };
  var aboveBeds = function (x) { var m = String(x.beds).match(/\d+/); return m ? +m[0] : 0; };
  var fresh = function (x) { return x.dom <= 14; };

  var saved = new Set();
  try { saved = new Set(JSON.parse(localStorage.getItem("fb-saved") || "[]")); } catch (e) {}
  var persist = function () { try { localStorage.setItem("fb-saved", JSON.stringify(Array.from(saved))); } catch (e) {} };

  var areas = {};
  L.forEach(function (x) { (areas[x.area] = areas[x.area] || []).push(x); });
  var areaStats = Object.keys(areas).map(function (a) {
    var g = areas[a];
    return { area: a, n: g.length, preferred: g[0].preferred, price: med(g.map(function (x) { return x.price; })), ppsf: med(g.map(function (x) { return x.ppsfAbove; })), taxes: med(g.map(function (x) { return x.taxes; })), dom: med(g.map(function (x) { return x.dom; })) };
  });
  var areaMed = {}; areaStats.forEach(function (s) { areaMed[s.area] = s; });
  var allPpsf = L.map(function (x) { return x.ppsfAbove; }).filter(Boolean).sort(function (a, b) { return a - b; });

  var state = { tab: "shortlist", sub: "findings", sort: { key: "score", dir: -1 }, mapMode: "all",
    f: { q: "", area: "all", maxPrice: 900000, minBeds: 3, saved: false, suite: false, ready: false, fresh: false } };

  document.getElementById("eyebrow").textContent = "Buyer’s field book · snapshot " + M.snapshot + (M.public ? " · public edition, no photos" : "");
  if (M.public) document.documentElement.classList.add("nopics");
  var main = document.getElementById("main"), drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");

  /* ---------- small components ---------- */
  function chip(t, kind) { return '<span class="chip ' + (kind || "") + '">' + esc(t) + "</span>"; }
  function chipsFor(x) {
    var c = [];
    c.push(chip((x.preferred ? "★ " : "") + x.area + (x.district && x.district !== "Waterloo" ? ", " + x.district : ""), x.preferred ? "pref" : ""));
    var reno = x.review ? x.review.reno_need : x.reno;
    c.push(chip(RENO[reno] || reno, reno === "none" ? "good" : reno === "moderate" || reno === "major" ? "warn" : ""));
    if (SUITE[x.suite]) c.push(chip(SUITE[x.suite], x.suite === "existing" ? "good" : ""));
    if (x.dom >= 60) c.push(chip(x.dom + " days listed", "warn")); else if (fresh(x)) c.push(chip("New · " + x.dom + " d"));
    if (x.review) c.push(chip("Photos reviewed"));
    return '<div class="chips">' + c.join("") + "</div>";
  }
  function stamp(x) {
    var s = score(x);
    return '<div class="stamp ' + band(s) + '"><b>' + s.toFixed(1) + "</b><span>" + (x.adjTotal != null ? "after photos" : "text score") + "</span></div>";
  }
  function homeRow(x) {
    var rk = x.final ? x.final : "";
    return '<button class="home" data-open="' + esc(x.id) + '"><div class="ph">' + (x.hero ? '<img alt="" loading="lazy" src="' + x.hero + '">' : "") +
      (rk ? '<span class="rk">' + rk + "</span>" : "") + "</div>" +
      "<div><h4>" + esc(x.address) + '</h4><div class="sub">' + esc(x.type || "") + " · " + esc(x.beds) + " bd · " + esc(x.baths) + " ba</div>" +
      '<p class="vd">' + esc(x.verdict) + "</p>" + chipsFor(x) + "</div>" +
      '<dl class="specs"><dt>Price</dt><dd class="p">' + money(x.price) + "</dd><dt>Above grade</dt><dd>" + num(x.above) + " sf</dd><dt>$ / sf above</dt><dd>" + num(x.ppsfAbove) +
      "</dd><dt>Taxes</dt><dd>" + money(x.taxes) + "</dd></dl>" + stamp(x) + "</button>";
  }

  /* ---------- views ---------- */
  function viewShortlist() {
    var top = L.filter(function (x) { return x.final; }).sort(function (a, b) { return a.final - b.final; });
    var also = L.filter(function (x) { return x.also; });
    var reviewed = L.filter(function (x) { return x.review; }).length;
    var patterns = [
      ["“Renovated” mostly means refreshed", "Most of these are 2002–2007 builder-grade houses with new counters, paint and appliances. Stipple ceilings, brass hardware and oak cabinets show up in almost every gallery."],
      ["Possible damp basements in three", "Drummerhill (dehumidifier running, sump pump replaced in 2026), Buttercup (tide line, rusted drain) and Thornview (dark spots on basement carpet). Ask each seller for the basement history."],

    return '<svg viewBox="0 0 ' + (ox + 270 * S + 10) + " " + (oy + 100 * S + 34) + '" role="img" aria-label="Lot ' + x.frontage + " by " + x.depth + ' feet"><rect x="0" y="' + oy + '" width="' + (ox - 8) + '" height="' + h + '" fill="url(#hatch)" opacity=".0"/>' +
      '<line class="axl" x1="' + (ox - 6) + '" y1="' + oy + '" x2="' + (ox - 6) + '" y2="' + (oy + h) + '" stroke-width="3"/><text x="' + (ox - 12) + '" y="' + (oy + h / 2) + '" text-anchor="end" transform="rotate(-90 ' + (ox - 12) + " " + (oy + h / 2) + ')">STREET</text>' +
      '<rect class="lotfill" x="' + ox + '" y="' + oy + '" width="' + w + '" height="' + h + '"/>' +
      '<text class="strong" x="' + (ox + w / 2) + '" y="' + (oy - 6) + '" text-anchor="middle">' + num(x.depth) + " ft deep</text>" +
      '<text class="strong" x="' + (ox + w + 6) + '" y="' + (oy + h / 2 + 3) + '">' + num(x.frontage) + " ft</text>" +
      '<text x="' + (ox + w / 2) + '" y="' + (oy + h / 2 + 4) + '" text-anchor="middle">≈ ' + num(area) + " sf</text>" +
      '<line class="axl" x1="' + ox + '" y1="' + (oy + 100 * S + 14) + '" x2="' + (ox + 100 * S) + '" y2="' + (oy + 100 * S + 14) + '" stroke-width="2"/><text x="' + (ox + 100 * S + 8) + '" y="' + (oy + 100 * S + 18) + '">100 ft</text></svg>';
  }
  function list(items, cls) { return items && items.length ? '<ul class="list ' + (cls || "") + '">' + items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") + "</ul>" : '<p class="sub">None noted.</p>'; }
  function cell(label, val, small) { return '<div><span class="label">' + label + '</span><div class="v">' + val + (small ? "<small>" + small + "</small>" : "") + "</div></div>"; }

  function openDetail(id) {
    var x = byId.get(id); if (!x) return;
    var r = x.review, am = areaMed[x.area], pct = x.ppsfAbove ? Math.round(100 * allPpsf.filter(function (v) { return v < x.ppsfAbove; }).length / allPpsf.length) : null;
    var imgs = x.gallery && x.gallery.length ? x.gallery : (x.hero ? [{ n: "01.jpg", src: x.hero }] : []);
    var html = '<div class="dhead"><span class="label">' + (x.final ? "Top ten · #" + x.final : x.also ? "Suite project" : "Text rank #" + x.textRank) + " · MLS® " + esc(x.mls) + '</span><span><button class="star" data-save="' + esc(x.id) + '" aria-pressed="' + saved.has(x.id) + '" aria-label="Save">' + (saved.has(x.id) ? "★" : "☆") + '</button> <button class="btn ghost" id="dclose">Close</button></span></div><div class="dbody">';
    html += "<div><h2>" + esc(x.address) + '</h2><div class="sub">' + (x.preferred ? "★ " : "") + esc(x.area) + (x.district ? ", " + esc(x.district) : "") + " · " + esc(x.type || "") + '</div><div class="price">' + money(x.price) + "</div></div>";
    if (imgs.length) html += '<div class="gal"><img class="main" id="gmain" alt="Listing photo ' + esc(imgs[0].n) + '" src="' + imgs[0].src + '"><div class="strip">' + imgs.map(function (g, i) { return '<button data-g="' + i + '" aria-current="' + (i === 0) + '" aria-label="Photo ' + esc(g.n) + '"><img alt="" src="' + g.src + '"></button>'; }).join("") + '</div><div class="label cap" id="gcap">' + (imgs.length > 1 ? imgs.length + " of " + (r ? r.photo_count_total : imgs.length) + " photos shown · " : "") + "photo " + esc(imgs[0].n) + "</div></div>";
    html += '<div class="titleblock">' + cell("Bd / Ba", esc(x.beds) + " / " + esc(x.baths)) + cell("Above grade", num(x.above) + " sf", x.below ? "+ " + num(x.below) + " sf below" : "") +
      cell("$ / sf above", num(x.ppsfAbove), am && am.ppsf ? "area median " + num(am.ppsf) + (pct != null ? " · cheaper than " + (100 - pct) + "% of homes" : "") : "") +
      cell("Taxes", money(x.taxes) + "/yr", am ? "area median " + money(am.taxes) : "") + cell("Listed", esc(x.listed || "–"), x.dom + " days") +
      cell("Lot", x.frontage && x.depth ? num(x.frontage) + " × " + num(x.depth) + " ft" : "–") + cell("Parking", esc(x.parking || "–")) + cell("Confidence", esc(x.confidence)) + "</div>";
    html += '<div class="dsec lot"><h3>Lot, drawn to a common scale</h3>' + lot(x) + "</div>";
    var w = Object.keys(WEIGHTS).reduce(function (o, k) { o[k] = WEIGHTS[k]; return o; }, {});
    html += '<div class="dsec"><h3>Score</h3>' + bars(x.scores, w) + '<p class="sub mono" style="margin-top:10px">Text score ' + x.total.toFixed(1) + (x.adjTotal != null ? " · after photos " + x.adjTotal.toFixed(1) + " (condition " + (r.photo_adjustment > 0 ? "+" : "") + r.photo_adjustment + ")" : " · photos not reviewed") + "</p></div>";
    html += '<div class="dsec"><h3>The read</h3><p class="callout">' + esc(x.verdict) + '</p><div class="two" style="margin-top:14px"><div><span class="label">Strengths</span>' + list(x.strengths, "good") + '</div><div><span class="label">Red flags</span>' + list(x.flags, "flags") + "</div></div>" +
      '<div style="margin-top:14px"><span class="label">Ask the agent</span>' + list(x.questions) + "</div>" + (x.negotiation ? '<p style="margin:14px 0 0"><span class="label">Leverage</span><br>' + esc(x.negotiation) + "</p>" : "") + "</div>";
    if (r) {
      html += '<div class="dsec"><h3>Photo review</h3><p class="sub mono">Viewed ' + r.photos_viewed.length + " of " + r.photo_count_total + " photos · finish: " + esc(r.finish_level) + " · work needed: " + esc(r.reno_need) + " · confidence " + esc(r.confidence) + "</p>" + bars(r.ratings) + '<p class="callout" style="margin-top:14px">' + esc(r.verdict) + "</p>" +
        '<details class="fold" open><summary>Seller said vs the photos (' + (r.discrepancies || []).length + ")</summary>" + list(r.discrepancies) + '</details><details class="fold" open><summary>Visible issues (' + (r.issues || []).length + ")</summary>" + list(r.issues, "flags") + '</details>' +
        '<details class="fold"><summary>Confirmed by the photos (' + (r.positives || []).length + ")</summary>" + list(r.positives, "good") + '</details><details class="fold"><summary>For the inspector (' + (r.inspection_focus || []).length + ")</summary>" + list(r.inspection_focus) + "</details>" +
        '<p class="sub" style="margin-top:8px">Photo filenames in these notes are the reviewer’s best reference and can be a frame or two off.</p></div>';
    }
    if (x.desc) html += '<details class="fold"><summary>Seller’s description</summary><p>' + esc(x.desc) + "</p></details>";
    html += '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open on realtor.ca</a>' + (x.floorplan ? '<a class="btn ghost" href="' + esc(x.floorplan) + '" target="_blank" rel="noopener">Floor plan</a>' : "") + (x.dups.length ? '<span class="sub mono">Also listed as ' + x.dups.map(esc).join(", ") + "</span>" : "") + "</div></div>";
    drawer.innerHTML = html; drawer.hidden = false; scrim.hidden = false; drawer.scrollTop = 0; drawer._imgs = imgs; drawer._id = id;
    document.getElementById("dclose").focus({ preventScroll: true });
  }
  function closeDetail() { drawer.hidden = true; scrim.hidden = true; }

  /* ---------- routing + events ---------- */
  function render() {
    document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", String(t.dataset.tab === state.tab)); });
    main.innerHTML = { shortlist: viewShortlist, all: viewAll, map: viewMap, market: viewMarket, report: viewReport }[state.tab]();
    if (state.tab === "all") bindAll();
    window.scrollTo(0, 0);
  }
  document.querySelector(".tabs").addEventListener("click", function (e) { var t = e.target.closest("[data-tab]"); if (t) { state.tab = t.dataset.tab; render(); } });
  scrim.addEventListener("click", closeDetail);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !drawer.hidden) closeDetail(); });
  function toggleSave(id) { if (saved.has(id)) saved.delete(id); else saved.add(id); persist(); }
  document.addEventListener("click", function (e) {
    var t = e.target;
    var sv = t.closest("[data-save]"); if (sv) { e.stopPropagation(); toggleSave(sv.dataset.save); if (!drawer.hidden) openDetailKeep(drawer._id); if (state.tab === "all") renderTable(); return; }
    var sort = t.closest("[data-sort]"); if (sort) { var k = sort.dataset.sort; if (state.sort.key === k) state.sort.dir *= -1; else { state.sort.key = k; state.sort.dir = COLS.filter(function (c) { return c.k === k; })[0].dir; } renderTable(); return; }
    var g = t.closest("[data-g]"); if (g && drawer._imgs) { var im = drawer._imgs[+g.dataset.g]; document.getElementById("gmain").src = im.src; document.getElementById("gcap").textContent = "photo " + im.n; drawer.querySelectorAll("[data-g]").forEach(function (b) { b.setAttribute("aria-current", String(b === g)); }); return; }
    var mm = t.closest("[data-mapmode]"); if (mm) { state.mapMode = mm.dataset.mapmode; render(); return; }
    var sb = t.closest("[data-sub]"); if (sb) { e.preventDefault(); state.tab = "report"; state.sub = sb.dataset.sub; render(); return; }
    var tb = t.closest("a[data-tab]"); if (tb) { e.preventDefault(); state.tab = tb.dataset.tab; render(); return; }
    var lk = t.closest("a[data-l]"); if (lk) { e.preventDefault(); openDetail(lk.dataset.l); return; }
    var op = t.closest("[data-open]"); if (op) { openDetail(op.dataset.open); return; }
    var dot = t.closest("[data-id]"); if (dot) { openDetail(dot.dataset.id); }
  });
  function openDetailKeep(id) { var st = drawer.scrollTop; openDetail(id); drawer.scrollTop = st; }
  document.addEventListener("mousemove", function (e) {
    var tip = document.getElementById("tip"); if (!tip) return;
    var d = e.target.closest && e.target.closest("[data-id]"), box = document.getElementById("mapbox");
    if (!d || !box || !box.contains(d)) { tip.hidden = true; return; }
    var x = byId.get(d.dataset.id), r = box.getBoundingClientRect();
    tip.innerHTML = esc(x.address) + "<br>" + money(x.price) + " · score " + score(x).toFixed(1) + "<br>" + esc(x.area);
    tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 250) + "px"; tip.style.top = (e.clientY - r.top + 14) + "px"; tip.hidden = false;
  });
  render();
})();
</script>
