00k semi median, 78 days unsold; text claims Laurelwood but MLS area is Columbia Hills.","strengths":["3 beds up with ensuite, hardwood, carpet free","Separate basement entrance, unfinished","Attached garage, double driveway, fenced yard","Taxes $3,426 below median"],"flags":["$798k vs attached median ~600k; about 33% over","78 days on market, no cut","Size only a 1500-2000 range, no exact sqft","Water heater rented; no year or update details","Listing says Laurelwood but subdivision differs"],"questions":["Exact above-grade sqft?","Is it 598A/B on one lot with shared agreements?","Roof/furnace ages; basement entrance permitted?"],"negotiation":"","desc":"","dups":[],"floorplan":null,"hero":null},{"id":"40842430-176-sandford-fleming-drive","mls":"40842430","src":"search","form":"detached","formNotes":"raised bungalow, detached, freehold; 3 above-grade beds + 1 lower (lower level 'mostly above grade').","textRank":38,"address":"176 Sandford Fleming Drive","area":"Beechwood West","district":"Waterloo","preferred":true,"price":889900,"beds":"3 + 1","baths":3,"type":"House","above":1507.0,"below":855.0,"sizeTotal":2362,"ppsfAbove":591,"taxes":6187.62,"dom":107,"listed":"2026-06-25","ownership":"Freehold","fee":null,"freehold":true,"frontage":81.0,"depth":130.0,"parking":"Attached Garage","lat":43.45594253,"lon":-80.56557646,"url":"https://www.realtor.ca/real-estate/29953497/176-sandford-fleming-drive-waterloo","scores":{"value":3,"condition":3,"layout":6,"location":8,"risk":5},"total":49.0,"confidence":"medium","reno":"moderate","suite":"likely","verdict":"Raised bungalow on a rare 81x130 lot near the $900k ceiling at $590/sqft above grade, sold as renovate/investor opportunity; poor value for a live-in buyer.","strengths":["Large 81x130 ft lot in Beechwood West (preferred), quiet area","3 beds on the main floor plus lower bedroom, rec room and bath: student-rental or in-law potential","Roof replaced 2026; attached garage, 4 parking","Price cut $899,900 to $889,900 within 4 days"],"flags":["$889,900 on 1507 sqft above grade = $590/sqft; total-sqft $377 flatters the 855 sqft basement","Description stresses 'renovate, personalize, build equity' and 'investors': dated interior likely","Description says 2 bathrooms, data says 3 (2pc in basement); listing text vague on specifics","107 days on market (since July); water heater rental; no furnace/window/A/C ages","$10k under the $900k budget cap leaves nothing for work"],"questions":["How dated is the interior? Any major work beyond the roof?","Is there a separate entrance to the lower level; is it a legal unit?","Furnace, A/C, window ages?","Why 107 days on market; any offers?"],"negotiation":"","desc":"","dups":[],"floorplan":"https://youriguide.com/176_sandford_fleming_dr_waterloo_on/doc/floorplan_imperial_en_u.pdf","hero":null},{"id":"X13581052-111-churchill-street","mls":"X13581052","src":"search","form":"row","formNotes":"Interior row unit, 24 ft wide with garage, but two shared walls and student-rental surroundings; fits an investor more than a live-in buyer.","textRank":39,"address":"111 Churchill Street","area":"Beechwood","district":"Waterloo","preferred":true,"price":399000,"beds":"5","baths":2,"type":"Row / Townhouse","above":null,"below":null,"sizeTotal":null,"ppsfAbove":null,"taxes":3891.0,"dom":84,"listed":"2026-07-18","ownership":"Freehold","fee":null,"freehold":true,"frontage":24.0,"depth":110.0,"parking":"Garage","lat":43.4563421,"lon":-80.5479638,"url":"https://www.realtor.ca/real-estate/30052633/111-churchill-street-waterloo","scores":{"value":6,"condition":3,"layout":4,"location":6,"risk":2},"total":44.0,"confidence":"medium","reno":"unknown","suite":"none","verdict":"Licensed 5-bed student-rental row house at $399k; cheap but sold as an investment, not a live-in home, with no condition info and tenant-market risks.","strengths":["$399,000 is far below attached medians (~$637k row)","5 bedrooms all above grade (2 main, 3 up), garage plus 2 driveway spots","Beechwood, near universities; central A/C, 24x110 lot"],"flags":["Marketed as licensed student rental, $33,000 gross income pitch","Built 31-50 years ago, no updates, roof or furnace age stated","Small bedrooms (about 10x8); 1100 sqft exact size unknown","Likely tenant-occupied; 80 days on market"],"questions":["Is it tenant-occupied and with what lease terms?","Rental licence transferable and city requirements?","Roof, furnace, windows, wiring age?","Actual above-grade sqft and any party wall issues?"],"negotiation":"","desc":"","dups":[],"floorplan":null,"hero":null}],"patterns":[{"title":"“Renovated” mostly means refreshed","text":"Most of these are 2002–2007 builder-grade houses with new counters, paint and appliances. Stipple ceilings, brass hardware and oak cabinets show up in almost every gallery: Interlaken’s kitchen and Baringham’s cabinets are the clearest cases."},{"title":"Basements are rarely suites","text":"Pineland, Candlewood, Havendale, Interlaken and Baringham have only small high basement windows that do not look egress-sized. Do not pay a suite premium without city registration."},{"title":"Check bedrooms against the floor plan","text":"Violet’s “4th bedroom” is a closetless family room (3 above grade), Culpepper is only 2 above grade, and Candlewood has an unmentioned basement wood stove. Drummerhill’s dehumidifier and new sump pump raise a damp-basement question."},{"title":"Photos cannot see the big items","text":"Roof, wiring, plumbing and foundation are invisible in listing photos, and some rooms are virtually staged. Make every offer conditional on a full inspection."}],"reportHtml":"<h1>Waterloo buyer analysis — freehold, 3+ beds above grade, ≤ $900k, preferred areas only<\/h1>\n<p>Snapshot: 2026-10-10. Source: realtor.ca, <strong>54 active listings = 39 unique properties<\/strong> (many homes are listed twice under different MLS numbers; each pair is merged). The search is now limited to your areas: Laurelwood, Beechwood (+ West), Clair Hills, Westvale, Columbia Hills and Eastbridge. Full ranking: <a href=\"#\" data-tab=\"all\">ranking.md<\/a>.<\/p>\n<h2>What changed since the 6 Oct snapshot<\/h2>\n<ul>\n<li><strong>Scope:<\/strong> only the south-west cluster and Eastbridge are scraped now. About 127 listings from other neighbourhoods were archived, not deleted.<\/li>\n<li><strong>Gone from the market (inactive):<\/strong> Thornview, Speckled Alder, White Cedar and Butternut. The earlier shortlist lost most of its members: Southwick, Mayfield, Thorncrest and Thornview are outside your areas or off the market, so they are no longer ranked.<\/li>\n<li><strong>New listings:<\/strong> 118 Ralston Place (needs a major makeover), 532 Westvale Drive, and 206 Buttercup Court (back under a new MLS number at $688,000).<\/li>\n<li><strong>Price changes:<\/strong> Pinerow −$19,900 (now $649,900), Sandford Fleming −$10,000, Violet −$6,000, Settlersfield B −$14,000, and <strong>Royal Fern +$36,000 (now $735,000, reason unknown)<\/strong>.<\/li>\n<li><strong>Preferred areas:<\/strong> Columbia Hills is now treated as preferred, since you chose to include it.<\/li>\n<\/ul>\n<h2>How this was done (and what it can't tell you)<\/h2>\n<ol>\n<li><strong>Prep (script):<\/strong> neighbourhood baselines, $/sqft, days on market, keyword flags (<code>prep.json<\/code>, <code>stats.md<\/code>).<\/li>\n<li><strong>Scoring:<\/strong> the 6 Oct pass scored every listing 0–10 on value 25%, condition 20%, layout 20%, location 20%, risk 15%. This pass re-scored only the new and price-changed listings. Totals are computed by script so the weights are identical for every listing.<\/li>\n<li><strong>Checks:<\/strong> I re-read the top of the list against the listing text and caught two bedroom-count problems (42 Culpepper and the Violet \"4th bedroom\", below).<\/li>\n<li><strong>Photos:<\/strong> 6 more homes were photo-reviewed this round (16 reviewed in total). See <a href=\"#\" data-sub=\"photo\">photo_review.md<\/a>. The <strong>photo-adjusted order there supersedes the text order<\/strong>.<\/li>\n<\/ol>\n<p><strong>Limits you should weigh:<\/strong><\/p>\n<ul>\n<li><strong>No sold prices.<\/strong> \"Value\" means cheap or dear compared with other <em>active<\/em> asks, not with what homes sell for. Sold comps from your agent are the single most useful missing input.<\/li>\n<li><strong>Baselines moved.<\/strong> Neighbourhood medians are now computed on the 54 in-area listings only, so $/sqft comparisons against the old 132-listing report do not carry over.<\/li>\n<li><strong>Several sizes are not exact.<\/strong> Pineland, Baringham and Candlewood have only a size range or an MPAC figure, so their value ranges are wide and rough.<\/li>\n<li><strong>Scores are judgment, not measurement.<\/strong> Photos show finishes, not roof, wiring, plumbing or foundation. Every offer needs an inspection condition.<\/li>\n<li><strong>\"3+ bedrooms\" means above grade.<\/strong> \"2 + 2\" is 2 above grade. 42 Culpepper fails the brief for this reason (converted from 3+2 to 2+2). 569 Violet is listed as 4 but is really 3 (the \"4th\" is a closetless family room).<\/li>\n<\/ul>\n<h2>Market snapshot (the 39 unique properties)<\/h2>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Price<\/td>\n<td>median $739,000; middle half $650k–$850k<\/td>\n<\/tr>\n<tr>\n<td>Days on market<\/td>\n<td>median 32; 10 listed in the last 14 days; 12 over 60 days; 5 over 90 days<\/td>\n<\/tr>\n<tr>\n<td>Condition (scorers' read)<\/td>\n<td>13 move-in ready, 21 cosmetic work, 2 moderate, 3 unknown<\/td>\n<\/tr>\n<tr>\n<td>Suites<\/td>\n<td>3 existing, 5 likely, 14 possible, 17 none<\/td>\n<\/tr>\n<tr>\n<td>Form<\/td>\n<td>23 detached, 5 semi, 4 end townhouse, 6 row, 1 duplex<\/td>\n<\/tr>\n<tr>\n<td>By area<\/td>\n<td>Columbia Hills 9, Clair Hills 7, Westvale 6, Beechwood 6, Beechwood West 6, Laurelwood 3, Eastbridge 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2>Shortlist (photo-adjusted order)<\/h2>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Home<\/th>\n<th>Area<\/th>\n<th>Ask<\/th>\n<th>Text<\/th>\n<th>Photos<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>424 Sauve Cres<\/td>\n<td>Clair Hills<\/td>\n<td>$899,900<\/td>\n<td>82.5<\/td>\n<td>84.5<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>756 Karlsfeld Rd<\/td>\n<td>Clair Hills<\/td>\n<td>$834,900<\/td>\n<td>84.0<\/td>\n<td>82.0<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>588 Drummerhill Cres<\/td>\n<td>Westvale<\/td>\n<td>$629,000<\/td>\n<td>78.0<\/td>\n<td>78.0<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>188 Pineland Ct<\/td>\n<td>Laurelwood<\/td>\n<td>$725,000<\/td>\n<td>74.5<\/td>\n<td>74.5<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>118 Candlewood Cres<\/td>\n<td>Beechwood<\/td>\n<td>$859,000<\/td>\n<td>71.5<\/td>\n<td>73.5<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>537 Havendale Pl<\/td>\n<td>Laurelwood<\/td>\n<td>$899,000<\/td>\n<td>71.0<\/td>\n<td>71.0<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>642 Interlaken Dr<\/td>\n<td>Clair Hills<\/td>\n<td>$850,000<\/td>\n<td>70.5<\/td>\n<td>70.5<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>569 Violet St<\/td>\n<td>Columbia Hills<\/td>\n<td>$849,900<\/td>\n<td>70.5<\/td>\n<td>70.5<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>511 Baringham Pl<\/td>\n<td>Beechwood West<\/td>\n<td>$799,000<\/td>\n<td>71.0<\/td>\n<td>69.0<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Suite projects, shown separately: <strong>31 Mulberry Ln<\/strong> (Beechwood, $699,900, 77.5 → 75.5) and <strong>512 Thorndale Dr<\/strong> (Westvale, $729,900, 71.5 → 69.5).<\/p>\n<p>The photo-adjusted total is the text total plus 2 × the photo adjustment. <\/p>\n<h2>1. 424 Sauve Crescent — Clair Hills — $899,900<\/h2>\n<p><strong>Verdict: the most solid house of the group, but you are at the ceiling.<\/strong><\/p>\n<ul>\n<li><strong>Space:<\/strong> four bedrooms all upstairs. Primary 18'5\" × 14'3\" with a 5-pc ensuite renovated 2021. 2,143 sqft above grade plus a 912 sqft basement finished 2018. Photo review confirmed real upgrades (+1).<\/li>\n<li><strong>Location:<\/strong> steps from Edna Staebler PS, near Laurel Heights SS.<\/li>\n<li><strong>Numbers:<\/strong> about $420/sqft above grade. The \"$295/sqft\" an agent once quoted counts the basement. Taxes $6,087.<\/li>\n<li><strong>Risks:<\/strong> the price is at your $900k limit, so there is no headroom for inspection findings or closing costs. Roof, furnace and window ages are not stated. Water heater is a rental.<\/li>\n<\/ul>\n<h2>2. 756 Karlsfeld Road — Clair Hills — $834,900<\/h2>\n<p><strong>Verdict: the best overall fit on paper. Move first, but \"renovated\" is mostly a surface refresh (photo adj. −1).<\/strong><\/p>\n<ul>\n<li><strong>Space and layout:<\/strong> 2,056 sqft above grade, about 2,600 finished. Five bedrooms (three up, two below grade), four baths, a 15-ft living room ceiling.<\/li>\n<li><strong>Condition (seller-stated):<\/strong> shingles and furnace 2020, water heater 2022, A/C and select windows 2023, painted 2026, renovated kitchen and bathrooms.<\/li>\n<li><strong>Setting:<\/strong> backs onto green belt, 34 × 135 ft fenced yard, attached garage.<\/li>\n<li><strong>Risks and questions:<\/strong> three-storey layout with many stairs; no separate entrance, so a suite would be a conversion. <\/li>\n<\/ul>\n<h2>3. 588 Drummerhill Crescent — Westvale — $629,000<\/h2>\n<p><strong>Verdict: best value, and it leaves about $270k of headroom under your cap.<\/strong><\/p>\n<ul>\n<li><strong>Space:<\/strong> 1,330 sqft above grade plus a 568 sqft finished basement, three bedrooms, two full baths, attached garage, 54 × 99 ft corner lot backing green belt.<\/li>\n<li><strong>Condition:<\/strong> roof 2021, A/C 2026, sump pump 2026. A running dehumidifier plus a new sump pump raise a <strong>damp-basement question<\/strong>: ask for the history.<\/li>\n<li><strong>Direct comp:<\/strong> 543 Drummerhill asks $649,900 for only 1,108 sqft above grade; 588 gives 222 more sqft for $20,900 less.<\/li>\n<li><strong>Trade-offs:<\/strong> only 3 bedrooms and 2 baths, a small kitchen, furnace and window ages not stated. Price changed 4 days ago (amount unknown).<\/li>\n<\/ul>\n<h2>4. 188 Pineland Court — Laurelwood — $725,000<\/h2>\n<p><strong>Verdict: a clean, move-in-ready house in a preferred area, priced fairly. The size is the unknown.<\/strong><\/p>\n<ul>\n<li><strong>Photos (adj. 0):<\/strong> refreshed kitchen, new ensuite, finished basement. Dated: original main bath, brass hardware, oak stair rail. The deck is smaller than \"large\". The basement has only small high windows, so it is not a suite.<\/li>\n<li><strong>Size:<\/strong> the listing gives only 1,500–2,000 sqft. The pricing reviewer assumed about 1,800 from the taxes. That assumption drives a $660k–$760k range, so <strong>get the floor area before you offer<\/strong>.<\/li>\n<\/ul>\n<h2>5. 118 Candlewood Crescent — Beechwood — $859,000<\/h2>\n<p><strong>Verdict: a large detached on a green-belt lot, but dear for what it is.<\/strong><\/p>\n<ul>\n<li><strong>Photos (adj. +1):<\/strong> fresh paint, updated kitchen and baths, double garage, 57 × 114 ft lot. Stipple, dated oak stairs and a 1970s basement keep it cosmetic. The \"newer\" deck looks weathered. <strong>A basement wood stove is not mentioned in the listing<\/strong> (needs a WETT check and an insurance question).<\/li>\n<\/ul>\n<h2>6. 537 Havendale Place — Laurelwood — $899,000<\/h2>\n<p><strong>Verdict: genuinely updated, but priced at the cap with no room.<\/strong><\/p>\n<ul>\n<li><strong>Photos (adj. 0):<\/strong> the kitchen and main floor are real updates. The \"luxurious\" ensuite is a dated sliding-door stand-up shower. The basement is plain laminate with small high windows and no bath. The photos look like spring shots against a September listing.<\/li>\n<\/ul>\n<h2>7. 642 Interlaken Drive — Clair Hills — $850,000<\/h2>\n<p><strong>Verdict: fairly priced, with a great yard.<\/strong><\/p>\n<ul>\n<li><strong>Photos (adj. 0):<\/strong> the roof (2018), furnace and A/C (2022), baths and walnut floors are stated updates. The kitchen is <strong>original honey oak with laminate counters<\/strong>, and the ensuite has a jetted tub with beige tile, which does not match \"beautifully updated (2022)\". Stipple ceilings throughout. 37 × 122 ft lot with no rear neighbours.<\/li>\n<\/ul>\n<h2>8. 569 Violet Street — Columbia Hills — $849,900<\/h2>\n<p><strong>Verdict: updated and on greenbelt, but it has 3 bedrooms, not 4, and it has been sitting.<\/strong><\/p>\n<ul>\n<li><strong>Photos (adj. 0):<\/strong> the kitchen, baths and ensuite are updated. Several rooms look <strong>virtually staged<\/strong>, which hides wear. The \"4th bedroom\" is a closetless 18'5\" × 11'5\" family room, so there are 3 bedrooms above grade. A walk-out basement; the \"separate entrance through the garage\" was not seen.<\/li>\n<\/ul>\n<h2>9. 511 Baringham Place — Beechwood West — $799,000<\/h2>\n<p><strong>Verdict: tidy but overpriced, with an unknown size.<\/strong><\/p>\n<ul>\n<li><strong>Photos (adj. −1):<\/strong> fresh paint and new bedroom floors, an updated ensuite and powder room, and a good deck. But the \"upgraded\" kitchen is repainted oak with white appliances, the basement is untouched 1980s (paneling, pink carpet, no egress-size window), and the ceilings have stipple.<\/li>\n<li><strong>Size:<\/strong> listing gives 1,500–2,000 sqft; the pricing reviewer estimated 1,550–1,700 from the room list.<\/li>\n<\/ul>\n<h2>Suite projects<\/h2>\n<p><strong>31 Mulberry Lane — Beechwood — $699,900.<\/strong> The best suite play in a preferred area, with caveats (photo adj. −1): the photo review found <strong>no photo of the suite<\/strong> and a deteriorating stairwell. Bungalow with 3 bedrooms upstairs and a lower suite (kitchen, 3 bedrooms, separate entrance); furnace and heat pump 2024 but <strong>roof 2011<\/strong>. A twin listing (40861414) says \"licensed for 6 students\" and \"vacant possession\", so it is probably a student rental. A lodging licence is not proof of a code-compliant second unit: ask for the licence, inspection history and egress documents.<\/p>\n<p><strong>512 Thorndale Drive — Westvale — $729,900.<\/strong> Mortgage-helper bungalow: three main-floor bedrooms (the floor plan confirms three, although the data says 2 + 3) and a walk-out lower apartment with its own entrance. The photo review (adj. −1) found the lower unit looks <strong>illegal or unsafe as built<\/strong> (interior stair straight into the rec room, no fire-separated door, a bedroom with only a tiny high window). Strong only if you intend to rent.<\/p>\n<h2>Next up<\/h2>\n<ul>\n<li><strong>608 Royal Fern St<\/strong> (Columbia Hills, $735,000, up from $699,000): cleanly refreshed, no rental equipment, but compact rooms and stipple. Ask why the price rose.<\/li>\n<li><strong>859 Brandenburg Blvd<\/strong> (Clair Hills, $879,000) and <strong>469 Westvale Dr<\/strong> (Westvale, $819,700, 4 beds): both score near 69 on text alone, but neither has been photo-reviewed.<\/li>\n<li><strong>532 Westvale Dr<\/strong> (Westvale, $755,000, new): a custom kitchen and a bigger yard make it the closest comp to Royal Fern. Scored 4/7/5/9/6; 1,349 sqft above grade makes it about $560/sqft.<\/li>\n<li><strong>118 Ralston Pl<\/strong> (Beechwood West, $850,000, new): 4 bedrooms above grade on a big cul-de-sac lot, but a 1980 house that needs a real makeover. Off-brief on condition.<\/li>\n<\/ul>\n<p><strong>Excluded despite a decent score:<\/strong> 42 Culpepper Dr (Beechwood, $899,900). It has only 2 bedrooms above grade.<\/p>\n<h2>Suggested next steps<\/h2>\n<ol>\n<li><strong>Ask your agent for sold comps<\/strong> within about 6 months in your six areas.<\/li>\n<li><strong>Confirm sizes<\/strong> at Pineland and Baringham before making an offer.<\/li>\n<li><strong>Ask Royal Fern's agent<\/strong> why the price rose by $36,000.<\/li>\n<li><strong>Treat photo findings as a first pass.<\/strong> Condition any offer on a full inspection.<\/li>\n<li><strong>Rerun the scraper weekly.<\/strong> After a few weeks, price changes and disappearances show which listings the market rejects.<\/li>\n<\/ol>\n<h2>Attached homes (semi-detached, link, townhouse)<\/h2>\n<p>Attached homes are scored on a separate rubric: value is judged against attached comps only, and shared walls, yard, parking, shared-driveway agreements and A/B lot boundaries count. Their scores are not directly comparable with the detached ones. Four attached homes in your areas have been photo-reviewed.<\/p>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th>A#<\/th>\n<th>Home<\/th>\n<th>Form<\/th>\n<th>Ask<\/th>\n<th>Text<\/th>\n<th>After photos<\/th>\n<th>What matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A1<\/td>\n<td>601 Pinerow Cres Unit A (Beechwood West)<\/td>\n<td>Semi (A/B)<\/td>\n<td>$649,900<\/td>\n<td>69.5<\/td>\n<td>67.5<\/td>\n<td>Updated, large fenced yard, but original oak, stipple and laminate remain.<\/td>\n<\/tr>\n<tr>\n<td>A2<\/td>\n<td>427 Beaver Creek Rd (Laurelwood)<\/td>\n<td>Row<\/td>\n<td>$699,000<\/td>\n<td>69.0<\/td>\n<td>67.0<\/td>\n<td>\"Fully renovated kitchen\" is new counters and appliances over original maple cabinets. Size is not exact in the listing.<\/td>\n<\/tr>\n<tr>\n<td>A3<\/td>\n<td>612 Brandenburg Blvd (Clair Hills)<\/td>\n<td>End townhouse<\/td>\n<td>$629,900<\/td>\n<td>65.0<\/td>\n<td>65.0<\/td>\n<td>Clean refresh over dated cherry cabinets and stipple ceilings. A hydro tower stands in the green strip behind it.<\/td>\n<\/tr>\n<tr>\n<td>A4<\/td>\n<td>513 Mariner Dr (Eastbridge)<\/td>\n<td>End townhouse<\/td>\n<td>$739,000<\/td>\n<td>64.5<\/td>\n<td>64.5<\/td>\n<td>Photos match the text; big private yard. Only 9 photos, size is an estimate.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What attached means for you<\/strong><\/p>\n<ul>\n<li>For similar money, detached homes are available: 543 Drummerhill at $649,900 and 588 Drummerhill at $629,000 cost about what Pinerow does.<\/li>\n<li>\"A/B\" semis (Pinerow A, Settlersfield B) are two halves of one lot: ask for the survey, the party-wall and shared-driveway agreements, and whether any fees apply.<\/li>\n<li>Interior row units usually have no side access to the back yard. Adding an in-law suite is harder in an attached home.<\/li>\n<li>New in this snapshot and not yet photo-reviewed: <strong>206 Buttercup Ct<\/strong> (semi, $688,000, scored 6/7/5/6/7 on text) and <strong>B-620 Settlersfield Ct<\/strong> (semi, $675,000, 3 + 1, low-confidence size).<\/li>\n<\/ul>","photoHtml":"<h1>Photo review<\/h1>\n<p>Sixteen homes have now been photo-reviewed by agents, each viewing 14–45 photos (all of them when ≤ 30, otherwise an even spread) and comparing them with the seller's text. Six of those were added in the 10 Oct round (Pineland, Candlewood, Havendale, Interlaken, Violet, Baringham). Raw findings: <code>analysis/photos/&lt;mls&gt;.json<\/code>.<\/p>\n<p><strong>Read these with some caution:<\/strong><\/p>\n<ul>\n<li>Photos show finishes and wear. They do <strong>not<\/strong> show roof age, furnace, wiring, plumbing or foundation condition. Every home still needs a proper inspection.<\/li>\n<li>Reviewers cite photo numbers (<code>13.jpg<\/code>), which may be a frame off. Treat citations as pointers to a region of the gallery.<\/li>\n<li>Some listings use virtually staged photos (Violet for certain, Interlaken possibly); real rooms may look emptier.<\/li>\n<li>Each home was reviewed by one agent, so there is no cross-check on any single judgment. The patterns across homes are more reliable than any single call.<\/li>\n<li>Only on-brief homes in the top 12 by text score were reviewed. 859 Brandenburg and 469 Westvale have not been.<\/li>\n<\/ul>\n<h2>Photo-adjusted order<\/h2>\n<p>Photo-adjusted total = text total + 2 × photo adjustment.<\/p>\n<div class=\"scroll\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Home<\/th>\n<th>Price<\/th>\n<th>Text<\/th>\n<th>Adj.<\/th>\n<th>Total<\/th>\n<th>Photo-based condition*<\/th>\n<th>Effect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>424 Sauve Cres (Clair Hills ★)<\/td>\n<td>$899.9k<\/td>\n<td>82.5<\/td>\n<td>+1<\/td>\n<td>84.5<\/td>\n<td>8/10<\/td>\n<td>Real upgrades confirmed. Best-condition house, but at your cap.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>756 Karlsfeld Rd (Clair Hills ★)<\/td>\n<td>$834.9k<\/td>\n<td>84.0<\/td>\n<td>−1<\/td>\n<td>82.0<\/td>\n<td>6/10<\/td>\n<td>\"Renovated\" is mostly a surface refresh. Leaves $65k of headroom for the refresh.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>588 Drummerhill Cres (Westvale ★)<\/td>\n<td>$629k<\/td>\n<td>78.0<\/td>\n<td>0<\/td>\n<td>78.0<\/td>\n<td>6/10<\/td>\n<td>Matches text; a dehumidifier plus a 2026 sump pump raise a damp-basement question.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>188 Pineland Ct (Laurelwood ★)<\/td>\n<td>$725k<\/td>\n<td>74.5<\/td>\n<td>0<\/td>\n<td>74.5<\/td>\n<td>8/10<\/td>\n<td>Clean and move-in ready. Size only a range.<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>118 Candlewood Cres (Beechwood ★)<\/td>\n<td>$859k<\/td>\n<td>71.5<\/td>\n<td>+1<\/td>\n<td>73.5<\/td>\n<td>7/10<\/td>\n<td>Slightly better than expected; unmentioned basement wood stove.<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>537 Havendale Pl (Laurelwood ★)<\/td>\n<td>$899k<\/td>\n<td>71.0<\/td>\n<td>0<\/td>\n<td>71.0<\/td>\n<td>8/10<\/td>\n<td>Matches text; ensuite and basement are plain. At the cap.<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>642 Interlaken Dr (Clair Hills ★)<\/td>\n<td>$850k<\/td>\n<td>70.5<\/td>\n<td>0<\/td>\n<td>70.5<\/td>\n<td>7/10<\/td>\n<td>Oak kitchen and jetted tub contradict \"beautifully updated\".<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>569 Violet St (Columbia Hills ★)<\/td>\n<td>$849.9k<\/td>\n<td>70.5<\/td>\n<td>0<\/td>\n<td>70.5<\/td>\n<td>7/10<\/td>\n<td>3 bedrooms, not 4; staged photos.<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>511 Baringham Pl (Beechwood West ★)<\/td>\n<td>$799k<\/td>\n<td>71.0<\/td>\n<td>−1<\/td>\n<td>69.0<\/td>\n<td>7/10<\/td>\n<td>\"Upgraded\" kitchen is repainted oak; untouched 1980s basement.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>*Reviewer's overall-condition rating, 0–10.<\/p>\n<p><strong>Also considered, as suite projects:<\/strong> 31 Mulberry Ln (Beechwood ★, $699.9k, 77.5 → 75.5): the suite has not been photographed, so the case rests on an unseen basement. 512 Thorndale Dr (Westvale ★, $729.9k, 71.5 → 69.5): the lower unit looks like it would need work to be legal.<\/p>\n<p><strong>Reviewed but not shortlisted:<\/strong> 608 Royal Fern St (Columbia Hills ★, $735k): photos match the text, but the text score is lower and the ask just rose $36,000.<\/p>\n<h2>Home by home<\/h2>\n<h3>756 Karlsfeld Road (adj. −1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> bright 15-ft living room, new quartz counters and backsplash, fresh paint, and a fully modernised lower-level ensuite.<\/li>\n<li><strong>Not as described:<\/strong> \"renovated kitchen and bathrooms\" is a surface refresh. Honey-oak cabinets with a chipped end panel, an oak island with corbels, beige 2004-era tile, a jetted corner tub and brass hardware remain. The deck is freshly painted solid red, which can hide rot.<\/li>\n<li><strong>Layout flag:<\/strong> the reviewer's read of the floor plan suggests the \"two bedrooms below grade\" may be one bedroom plus an office, with the rest utility and storage. Confirm the real bedroom count (it is still at least 4).<\/li>\n<li><strong>Not visible:<\/strong> roof, furnace, A/C, water heater, utility room.<\/li>\n<li><strong>Inspect:<\/strong> deck ledger and footings under the paint; sump and window wells; roof granule loss.<\/li>\n<\/ul>\n<h3>424 Sauve Crescent (adj. +1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the 2021 ensuite (freestanding tub, double vanity, tiled walk-in shower) and the 2018 basement with a gas fireplace.<\/li>\n<li><strong>Not as described:<\/strong> \"nothing left to do\" overstates it. Kitchen (oak cabinets, laminate-look counters), main bath and stipple ceilings are 2007 builder-era. Side yards are narrow with neighbours' walls a few feet away. A hot tub sits on the deck.<\/li>\n<li><strong>Not visible:<\/strong> laundry, mechanicals, roof, the bathroom rough-in in the basement.<\/li>\n<li><strong>Inspect:<\/strong> hot tub electrical and deck footings; roof; basement drainage and ceiling height under the bulkheads.<\/li>\n<\/ul>\n<h3>588 Drummerhill Crescent (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> clean, fresh paint and carpet, glossy hardwood, roof looks even from the aerial shot.<\/li>\n<li><strong>Not as described:<\/strong> \"modern living\" and \"private backyard oasis\". The kitchen and both baths are early-2000s (maple cabinets, white appliances, a jetted tub). The yard is small and overlooked, with a neighbour's pool right behind.<\/li>\n<li><strong>Moisture flag:<\/strong> a portable dehumidifier is running in the basement, the ceiling is low with bulkheads, and the sump pump was replaced in 2026. Ask the seller why.<\/li>\n<li><strong>Inspect:<\/strong> foundation walls and the floor/wall joint, sump discharge and backup, A/C and furnace.<\/li>\n<\/ul>\n<h3>188 Pineland Court (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> clean and move-in ready; refreshed kitchen counters and sink, new ensuite, finished basement.<\/li>\n<li><strong>Not as described:<\/strong> the \"large deck\" is a modest, sun-faded deck about the width of the sliding door. The kitchen is refreshed, not new (black range, builder-grade layout). The main bath, powder room and basement powder room are original (laminate counters, brown vinyl, brass). The basement has only small high windows and a raised step splits the room: <strong>not a suite<\/strong>.<\/li>\n<li><strong>Size flag:<\/strong> 15 of 22 photos were viewed; the floor area is a range only (1,500–2,000 sqft).<\/li>\n<li><strong>Not visible:<\/strong> roof, furnace and A/C age (the condenser is visible at the side), water heater rental terms.<\/li>\n<li><strong>Inspect:<\/strong> permits and workmanship for the ensuite and basement finish.<\/li>\n<\/ul>\n<h3>118 Candlewood Crescent (adj. +1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> fresh paint, updated kitchen and baths, a good green-belt lot, double garage.<\/li>\n<li><strong>Not as described:<\/strong> the \"newer\" deck looks weathered (older posts and railings). Counters look like engineered quartz, not granite. Stipple remains in the family room, appliances are mixed, and the basement is 1970s (drop ceiling, cedar panelling, bar, small high windows, no egress-size window).<\/li>\n<li><strong>Not mentioned by the seller:<\/strong> a <strong>freestanding wood stove on a brick hearth in the basement<\/strong>. It needs a WETT inspection and an insurance check.<\/li>\n<li><strong>Not visible:<\/strong> roof, furnace, A/C, wiring, plumbing; aluminum siding and eavestrough condition.<\/li>\n<\/ul>\n<h3>537 Havendale Place (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the kitchen and main floor are genuinely updated; the 2025 upstairs floors are real.<\/li>\n<li><strong>Not as described:<\/strong> the \"luxurious\" ensuite is a framed sliding-door stand-up shower with a vinyl floor and quartz vanity: tidy but plain. The \"finished\" basement is a 24' × 22' laminate rec room with two small high windows and no bath. The deck is weathered grey. Upstairs has textured ceilings and builder closet doors.<\/li>\n<li><strong>Photo date:<\/strong> the photos look like spring shots against a September listing. Ask whether it was relisted.<\/li>\n<li><strong>Not visible:<\/strong> roof, furnace, A/C, rental water heater, wiring, plumbing, foundation, basement moisture.<\/li>\n<\/ul>\n<h3>642 Interlaken Drive (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> tidy and move-in ready, a great yard (37 × 122 ft, no rear neighbours), updated walnut floors.<\/li>\n<li><strong>Not as described:<\/strong> the ensuite \"beautifully updated (2022)\" is a corner jetted tub with beige tile surround and a framed corner shower. The kitchen is original honey oak with laminate counters and beige floor tile; only the appliances look updated. The listing says 4 baths; the plan shows a main 2-pc, the ensuite, a main full bath and a basement 2-pc. Stipple ceilings throughout. The basement has a drop ceiling and small windows: <strong>not a suite<\/strong>.<\/li>\n<li><strong>Staging:<\/strong> the reviewer could not tell which photos are virtually staged. Ask for empty-room originals.<\/li>\n<li><strong>Not visible:<\/strong> roof (2018), furnace and A/C (2022) are stated, not seen; window ages and seals; wiring, plumbing, foundation.<\/li>\n<\/ul>\n<h3>569 Violet Street (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> updated kitchen, baths and ensuite; greenbelt backdrop; walk-out basement.<\/li>\n<li><strong>Not as described:<\/strong> the \"4th bedroom option\" is an 18'5\" × 11'5\" room with <strong>no closet, labelled FAMILY on the floor plan<\/strong>, so this is a 3-bedroom house. Several rooms (05, 07, 15, 20, 22) look <strong>virtually staged<\/strong>, which hides lived-in wear. The \"separate entrance through the garage\" was not seen in any photo. Stipple ceilings and dark hand-scraped-look hardwood remain; the deck boards are faded and the lower rear deck posts are weathered.<\/li>\n<li><strong>Inspect:<\/strong> basement moisture and egress window sizes; whether the garage-side entrance and any suite rough-in are permitted; deck structure and lower posts.<\/li>\n<\/ul>\n<h3>511 Baringham Place (adj. −1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> fresh paint and new bedroom floors, an updated ensuite and powder room, a good deck.<\/li>\n<li><strong>Not as described:<\/strong> the \"upgraded kitchen\" is repainted oak-style cabinets with new black pulls, laminate-look counters and white appliances. The \"partially finished\" basement is entirely original-era (wood panelling, drop ceiling, pink carpet, wallpaper border), and its \"bedroom\" has only a tiny high window, so treat it as a den. Stipple ceilings throughout, including upstairs, and 1990s light fixtures.<\/li>\n<li><strong>Not visible:<\/strong> roof (2022), windows (2018/2022), furnace and A/C ages; foundation type is listed as unknown.<\/li>\n<li><strong>Inspect:<\/strong> basement moisture behind the panelling.<\/li>\n<\/ul>\n<h3>31 Mulberry Lane (adj. −1) — the one to be most sceptical about<\/h3>\n<ul>\n<li><strong>Biggest gap:<\/strong> none of the 45 photos show the basement suite, which is the reason to buy this house.<\/li>\n<li><strong>Visible problems:<\/strong> the basement walk-up stairwell has cracked and patched concrete, moss and rotted wood; a front basement window is covered in plastic sheeting; the main kitchen is original oak and laminate with checkerboard vinyl; ceilings are stipple; the floor plan the reviewer read suggests the lower \"3 bedrooms\" may include a study.<\/li>\n<li><strong>Positive:<\/strong> large treed corner lot, a big deck, a clean neutral main floor, a partly refreshed bathroom.<\/li>\n<li><strong>Before any offer:<\/strong> see the suite in person, with the city rental licence, egress windows, ceiling height, fire separation and moisture. The twin listing's \"licensed for 6 students\" and \"vacant October 1\" make wear likely.<\/li>\n<\/ul>\n<h3>512 Thorndale Drive (adj. −1)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> clean and freshly painted, no water marks or mould. The lower level has new plank flooring and a bright rec room that walks out through a slider.<\/li>\n<li><strong>Not as described, and the main concern:<\/strong> the floor plans show an open interior stair from the main floor straight down into the lower level, with no fire-separated door apparent; the lower \"well sized kitchen\" is a small laminate kitchenette; one lower bedroom has only a tiny high window that looks non-egress. The main-floor bedrooms are small (two are about 9' × 12' and 10' × 8').<\/li>\n<li><strong>Read:<\/strong> as built it probably would not qualify as a legal second unit without work. Treat the \"mortgage helper\" as a project, and verify city registration before paying for it.<\/li>\n<\/ul>\n<h3>608 Royal Fern Street (adj. 0)<\/h3>\n<ul>\n<li><strong>Confirmed:<\/strong> the kitchen, both renovated bathrooms and the basement (pot lights, new corner shower) look genuinely refreshed. The utility room is tidy (Carrier A/C, Infiniti furnace; install dates not legible). No visible water stains, cracks or mould.<\/li>\n<li><strong>Not as described:<\/strong> the \"open-concept\" main floor is compact (kitchen 12' × 8'7\", dining 10'4\" × 7'2\", separated by a pass-through). Stipple ceilings remain, the upstairs floors are dark laminate rather than hardwood, two bedrooms are narrow, and kitchen cabinets are painted rather than replaced. The basement \"potential fourth bedroom\" has one small high window. Several photos look AI-enhanced or are marketing graphics.<\/li>\n<li><strong>Inspect:<\/strong> roof (2015 claimed), furnace and A/C (2022 claimed), basement permits and egress, waterproofing in the 2026 bathrooms.<\/li>\n<\/ul>\n<h2>Cross-cutting patterns<\/h2>\n<ol>\n<li><strong>Most of these are 2002–2007 builder-grade houses with a 2026 surface refresh.<\/strong> Stipple ceilings, brass hardware, oak cabinets and beige tile appear in almost all of them. Sellers say \"renovated\", \"upgraded\" or \"luxurious\" for new counters, paint and appliances; read those words as \"refreshed\". The clearest cases this round: Interlaken's oak kitchen, Baringham's repainted cabinets, Havendale's plain ensuite.<\/li>\n<li><strong>Basements rarely qualify as suites.<\/strong> Pineland, Candlewood, Havendale, Interlaken and Baringham all have only small high windows and no egress-size window. Thorndale's and Mulberry's suites are unverified. Don't pay a suite premium without city registration.<\/li>\n<li><strong>Staging and enhanced photos hide wear<\/strong> at Violet (several rooms) and possibly Interlaken; Havendale's photos look seasonally out of date. Ask for empty-room originals and see the house in person.<\/li>\n<li><strong>Bedroom counts need checking against floor plans:<\/strong> Violet's \"4th bedroom\" is a family room, Culpepper is 2 above grade, Thorndale's data tag is wrong. A moisture question hangs over Drummerhill.<\/li>\n<li><strong>Decks<\/strong> were weathered, painted over or faded in Karlsfeld, Candlewood, Havendale, Violet and Mulberry. Budget for deck repair.<\/li>\n<li><strong>Nothing here shows a deal-breaker defect<\/strong>, but the photos cannot show roof, wiring, plumbing or foundation condition. Make every offer conditional on a full inspection.<\/li>\n<\/ol>"}</script>
<script>
(function () {
  "use strict";

  var WEIGHTS = { value: 25, condition: 20, layout: 20, location: 20, risk: 15 };
  var NAMES = { value: "Value", condition: "Condition", layout: "Layout", location: "Location", risk: "Risk (10 = low)" };
  var SHORT = { value: "Value", condition: "Condition", layout: "Layout", location: "Location", risk: "Risk" };
  var RENO = { none: "Move-in ready", cosmetic: "Cosmetic work", moderate: "Moderate work", major: "Major work", unknown: "Condition unknown" };
  var SUITE = { existing: "Suite in place", likely: "Suite likely", possible: "Suite possible" };
  var BANDW = { good: "▲ Strong", warn: "■ Fair", bad: "▼ Weak" };
  var BM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg>';

  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var money = function (n) { return n == null ? "–" : "$" + Math.round(n).toLocaleString("en-CA"); };
  var kfmt = function (n) { if (n == null) return "–"; var v = Math.round(n / 100) / 10; return "$" + (v % 1 === 0 ? v : v.toFixed(1)) + "k"; };
  var num = function (n, d) { return n == null ? "–" : Number(n).toLocaleString("en-CA", { maximumFractionDigits: d || 0 }); };
  var med = function (a) { a = a.filter(function (v) { return v != null; }).sort(function (x, y) { return x - y; }); if (!a.length) return null; var m = a.length >> 1; return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2; };
  var score = function (x) { return x.adjTotal != null ? x.adjTotal : x.total; };
  var band = function (t) { return t >= 70 ? "good" : t >= 55 ? "warn" : "bad"; };
  var aboveBeds = function (x) { var m = String(x.beds).match(/\d+/); return m ? +m[0] : 0; };

        '<div style="margin-top:16px">' + findings(r.discrepancies, "sev-warn", "Said vs seen") + findings(r.issues, "sev-bad", "Issue") + "</div>" +
        (r.attached_notes && r.attached_notes.length ? '<details class="fold" open><summary>Shared wall, yard and parking (' + r.attached_notes.length + ")</summary>" + list(r.attached_notes) + "</details>" : "") +
        '<details class="fold"><summary>Confirmed by the photos (' + (r.positives || []).length + ")</summary>" + list(r.positives, "good") + '</details><details class="fold"><summary>For the inspector (' + (r.inspection_focus || []).length + ")</summary>" + list(r.inspection_focus) + "</details>" +
        '<p class="caveat" style="margin-top:8px">Photos cannot show roof, wiring, plumbing or foundation. Photo filenames in these notes are the reviewer’s best reference and can be a frame or two off.</p></section>';
    }
    html += priceBlock(x);
    html += '<section class="dsec lot"><h3><span>Lot, drawn to a common scale</span></h3>' + lot(x) + "</section>";
    if (x.desc) html += '<section class="dsec"><h3><span>Seller’s description</span><span class="r">verbatim</span></h3><details class="fold" style="border-top:0"><summary>Read the description</summary><p>' + esc(x.desc) + "</p></details></section>";
    html += '<div class="links"><a class="btn btn-primary" href="' + esc(x.url) + '" target="_blank" rel="noopener">Open on realtor.ca</a>' + (x.floorplan ? '<a class="btn" href="' + esc(x.floorplan) + '" target="_blank" rel="noopener">Floor plan</a>' : "") + (x.dups.length ? '<span class="sub mono" style="font-size:12px">Also listed as ' + x.dups.map(esc).join(", ") + "</span>" : "") + "</div></div>";
    if (drawer.hidden) { drawer._opener = document.activeElement; }
    drawer.innerHTML = html; drawer.hidden = false; scrim.hidden = false; drawer.scrollTop = 0; drawer._imgs = imgs; drawer._id = id;
    drawer.setAttribute("aria-labelledby", "dtitle");
    setBackground(true);
    document.getElementById("dclose").focus({ preventScroll: true });
    syncHash();
  }
  function setBackground(modal) {
    document.getElementById("top").inert = modal; document.getElementById("tabs").inert = modal; main.inert = modal;
    document.body.style.overflow = modal ? "hidden" : "";
  }
  function closeDetail() {
    if (drawer.hidden) return;
    drawer.hidden = true; scrim.hidden = true; setBackground(false);
    var o = drawer._opener; drawer._opener = null;
    if (o && o.isConnected && o.focus) { try { o.focus({ preventScroll: true }); } catch (e) {} }
    syncHash();
  }
  function stepDetail(d) { var li = drawer._list || [], i = li.indexOf(drawer._id) + d; if (i >= 0 && i < li.length) openDetail(li[i]); }

  /* ---------- hash routing: #tab, #report/photo, add &h=<listing> for an open home ---------- */
  var applying = false;
  function hashFor() { return state.tab + (state.tab === "report" && state.sub !== "findings" ? "/" + state.sub : "") + (drawer.hidden ? "" : "&h=" + encodeURIComponent(drawer._id)); }
  function syncHash() { if (applying) return; var h = hashFor(); if (location.hash.slice(1) !== h) { try { history.pushState(null, "", "#" + h); } catch (e) {} } }
  function applyHash() {
    applying = true;
    try {
      var parts = location.hash.slice(1).split("&"), t = parts[0].split("/"), tab = TABS.indexOf(t[0]) >= 0 ? t[0] : "shortlist", sub = t[1] === "photo" ? "photo" : "findings", h = null;
      parts.slice(1).forEach(function (p) { if (p.indexOf("h=") === 0) h = decodeURIComponent(p.slice(2)); });
      if (tab !== state.tab || sub !== state.sub || !main.innerHTML) { state.tab = tab; state.sub = sub; render(true); }
      if (h && byId.has(h)) { if (drawer.hidden || drawer._id !== h) openDetail(h); } else closeDetail();
    } finally { applying = false; }
  }
  window.addEventListener("popstate", applyHash);
  window.addEventListener("hashchange", applyHash);

  /* ---------- routing + events ---------- */
  function render(keep) {
    document.querySelectorAll(".tab").forEach(function (t) { var on = t.dataset.tab === state.tab; t.setAttribute("aria-selected", String(on)); t.tabIndex = on ? 0 : -1; });
    main.setAttribute("aria-labelledby", "tab-" + state.tab);
    main.innerHTML = { shortlist: viewShortlist, all: viewAll, compare: viewCompare, map: viewMap, market: viewMarket, report: viewReport }[state.tab]();
    if (state.tab === "all") bindAll();
    if (state.tab === "report") buildToc();
    refreshCounts();
    if (!keep) window.scrollTo(0, 0);
    syncHash();
  }
  document.getElementById("tabs").addEventListener("click", function (e) { var t = e.target.closest("[data-tab]"); if (t) { state.tab = t.dataset.tab; render(); } });
  document.getElementById("savedbtn").addEventListener("click", function () { state.f.saved = true; state.tab = "all"; render(); });
  scrim.addEventListener("click", closeDetail);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !drawer.hidden) closeDetail(); });
  function toggleSave(id) { if (saved.has(id)) saved.delete(id); else saved.add(id); persist(); }
  document.addEventListener("click", function (e) {
    var t = e.target;
    var sv = t.closest("[data-save]"); if (sv) { e.stopPropagation(); toggleSave(sv.dataset.save); refreshStars(); if (state.tab === "all" && (state.f.saved || state.sort.key === "save")) renderTable(); if (state.tab === "compare") render(true); return; }
    var sort = t.closest("[data-sort]"); if (sort) { var k = sort.dataset.sort; if (state.sort.key === k) state.sort.dir *= -1; else { state.sort.key = k; state.sort.dir = COLS.filter(function (c) { return c.k === k; })[0].dir; } renderTable(); var th = document.querySelector('[data-sort="' + k + '"]'); if (th) th.focus({ preventScroll: true }); return; }
    var g = t.closest("[data-g]"); if (g && drawer._imgs) { var im = drawer._imgs[+g.dataset.g]; document.getElementById("gmain").src = im.src; document.getElementById("gcap").textContent = "photo " + im.n; drawer.querySelectorAll("[data-g]").forEach(function (b) { b.setAttribute("aria-current", String(b === g)); }); return; }
    var to = t.closest("[data-topo]"); if (to) { state.topOnly = to.dataset.topo === "1"; render(true); return; }
    var mm = t.closest("[data-mapmode]"); if (mm) { state.mapMode = mm.dataset.mapmode; render(true); return; }
    var tc = t.closest("[data-toc]"); if (tc) { e.preventDefault(); var hd = document.getElementById(tc.dataset.toc); if (hd) hd.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); document.querySelectorAll("[data-toc]").forEach(function (a) { a.setAttribute("aria-current", String(a === tc)); }); return; }
    var sb = t.closest("[data-sub]"); if (sb) { e.preventDefault(); state.tab = "report"; state.sub = sb.dataset.sub; render(); return; }
    var tb = t.closest("a[data-tab]"); if (tb) { e.preventDefault(); state.tab = tb.dataset.tab; render(); return; }
    var lk = t.closest("a[data-l]"); if (lk) { e.preventDefault(); openDetail(lk.dataset.l); return; }
    var nv = t.closest("[data-nav]"); if (nv) { stepDetail(+nv.dataset.nav); return; }
    var op = t.closest("[data-open]"); if (op) {
      var box = op.closest("[data-list]"), ids = box ? Array.prototype.map.call(box.querySelectorAll("[data-open]"), function (n) { return n.dataset.open; }).filter(function (v, i, a) { return a.indexOf(v) === i; }) : [op.dataset.open];
      openDetail(op.dataset.open, ids); return;
    }
    var dot = t.closest("[data-id]"); if (dot) {
      if (lastPtr === "touch" && tipId !== dot.dataset.id) { showTip(dot.dataset.id, e.clientX, e.clientY); return; }
      hideTip(); openDetail(dot.dataset.id);
    }
  });
  function refreshCounts() {
    var n = Array.from(saved).filter(function (id) { return byId.has(id); }).length;
    document.getElementById("cmpn").textContent = n ? n : "";
    document.getElementById("savedn").textContent = n;
  }
  function refreshStars() {
    document.querySelectorAll("[data-save]").forEach(function (b) {
      var on = saved.has(b.dataset.save); b.setAttribute("aria-pressed", String(on));
      var l = b.querySelector(".svl"); if (l) { l.textContent = on ? "Saved" : "Save"; b.classList.toggle("btn-accent", on); }
    });
    refreshCounts(); updateCmpBar();
  }
  var tipEl = document.getElementById("tip"), tipId = null;
  function showTip(id, cx, cy) {
    var x = byId.get(id); if (!x) return;
    tipId = id;
    tipEl.innerHTML = "<b>" + esc(x.address) + "</b><br>" + money(x.price) + " · score " + score(x).toFixed(1) + "<br>" + esc(x.area) + (x.ppsfAbove ? " · $" + num(x.ppsfAbove) + "/sf" : "") + (lastPtr === "touch" ? "<br><b>Tap again to open</b>" : "");
    tipEl.hidden = false;
    var w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    tipEl.style.left = Math.max(6, Math.min(cx + 14, window.innerWidth - w - 6)) + "px";
    tipEl.style.top = Math.max(6, Math.min(cy + 14, window.innerHeight - h - 6)) + "px";
  }
  function hideTip() { tipEl.hidden = true; tipId = null; }
  document.addEventListener("mousemove", function (e) {
    if (lastPtr === "touch" || !drawer.hidden) return;
    var d = e.target.closest && e.target.closest("#main [data-id]");
    if (!d) { hideTip(); return; }
    showTip(d.dataset.id, e.clientX, e.clientY);
  });
  document.addEventListener("focusin", function (e) {
    var d = e.target.closest && e.target.closest("#main [data-id]");
    if (!d) { hideTip(); return; }
    if (!d.matches(":focus-visible")) return;
    var r = d.getBoundingClientRect(); showTip(d.dataset.id, r.right, r.top);
  });
  document.addEventListener("scroll", hideTip, { passive: true });
  var lastW = main.clientWidth, rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      var w = main.clientWidth;
      if (Math.abs(w - lastW) > 24 && (state.tab === "map" || state.tab === "market")) { lastW = w; render(true); }
    }, 180);
  });
  document.addEventListener("keydown", function (e) {
    var tg = e.target, tag = tg.tagName;
    if (!drawer.hidden && (e.key === "ArrowLeft" || e.key === "ArrowRight") && tag !== "INPUT" && tag !== "SELECT" && tag !== "TEXTAREA") { stepDetail(e.key === "ArrowRight" ? 1 : -1); e.preventDefault(); return; }
    if (e.key === "Tab" && !drawer.hidden) {
      var f = Array.prototype.filter.call(drawer.querySelectorAll("button:not([disabled]), a[href], summary, [tabindex]:not([tabindex='-1'])"), function (n) { return n.offsetParent !== null; });
      if (f.length) { var first = f[0], last = f[f.length - 1]; if (e.shiftKey && (tg === first || !drawer.contains(tg))) { last.focus(); e.preventDefault(); } else if (!e.shiftKey && (tg === last || !drawer.contains(tg))) { first.focus(); e.preventDefault(); } }
      return;
    }
    if (tg.closest && tg.closest("[role=tablist]") && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "Home" || e.key === "End")) {
      var i = TABS.indexOf(tg.dataset.tab); if (i < 0) return;
      i = e.key === "Home" ? 0 : e.key === "End" ? TABS.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + TABS.length) % TABS.length;
      state.tab = TABS[i]; render(); document.getElementById("tab-" + TABS[i]).focus(); e.preventDefault(); return;
    }
    if (e.key !== "Enter" && e.key !== " ") return;
    if (tag === "BUTTON" || tag === "INPUT" || tag === "SELECT" || tag === "A" || tag === "SUMMARY") return;
    var so = tg.closest && tg.closest("[data-sort]"); if (so) { so.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true })); e.preventDefault(); return; }
    var op = tg.closest && tg.closest("[data-open], #main [data-id]");
    if (op) { op.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true })); e.preventDefault(); }
  });
  applyHash();
})();
</script>
