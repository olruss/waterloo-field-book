<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Waterloo Field Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Concept: a surveyor's field book (v2, from the Claude Design canvas). Drafting vellum on a faint
   plan grid, slate ink, plan-blue accent. Numbers in mono, always tabular. Every status pairs colour
   with a shape and a word; estimates carry a dashed "est" marker. */
:root {
  --paper: #ECEFEA;        /* page ground (vellum) */
  --sheet: #F8FAF6;        /* raised surface */
  --sheet-2: #F1F4EF;      /* inset, table head */
  --ink: #15232B;          /* text, data marks */
  --ink-2: #44545D;        /* secondary 7.4:1 */
  --ink-3: #5F6E76;        /* captions, axes 5.0:1 */
  --rule: #D3DAD4;         /* hairlines */
  --rule-2: #A9B4AE;       /* strong rules, ticks */
  --grid: rgba(31, 78, 140, .055);
  --accent: #1F4E8C;       /* plan blue */
  --accent-ink: #FFFFFF;
  --accent-wash: #DFE7F1;
  --good: #17795F;  --good-wash: #E4F2EC;
  --warn: #8F6200;  --warn-wash: #F7EFDB;
  --bad: #A5372A;   --bad-wash: #F4DEDA;
  --photo: #D9DFDA;
  --hatch: rgba(21, 35, 43, .07);
  --scrim: rgba(13, 22, 28, .42);
  --shadow-1: 0 1px 0 rgba(21,35,43,.06), 0 1px 2px rgba(21,35,43,.06);
  --shadow-2: 0 1px 0 rgba(21,35,43,.05), 0 10px 28px -14px rgba(21,35,43,.28);
  --shadow-3: 0 24px 64px -20px rgba(13,22,28,.45);
  --f-display: "Bricolage Grotesque", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --f-read: "Source Serif 4", Georgia, serif;
  --r1: 2px; --r2: 4px; --r3: 8px; --r4: 14px;
  --ease: cubic-bezier(.2, .7, .2, 1); --t-fast: 140ms; --t-med: 240ms;
  --nav-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0E161B; --sheet: #16222A; --sheet-2: #1B2932; --ink: #E3E9E5; --ink-2: #B1BDB8; --ink-3: #8D9BA2;
    --rule: #2A3943; --rule-2: #44555F; --grid: rgba(127, 168, 224, .05);
    --accent: #8DB3E8; --accent-ink: #0E161B; --accent-wash: #1F3249;
    --good: #5CC9A1; --good-wash: #173A30; --warn: #E0AE4E; --warn-wash: #3A2F15; --bad: #EE8A78; --bad-wash: #432420;
    --photo: #22313A; --hatch: rgba(227, 233, 229, .06); --scrim: rgba(0, 0, 0, .6);
    --shadow-1: 0 1px 0 rgba(0,0,0,.3); --shadow-2: 0 1px 0 rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.7); --shadow-3: 0 24px 64px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0E161B; --sheet: #16222A; --sheet-2: #1B2932; --ink: #E3E9E5; --ink-2: #B1BDB8; --ink-3: #8D9BA2;
  --rule: #2A3943; --rule-2: #44555F; --grid: rgba(127, 168, 224, .05);
  --accent: #8DB3E8; --accent-ink: #0E161B; --accent-wash: #1F3249;
  --good: #5CC9A1; --good-wash: #173A30; --warn: #E0AE4E; --warn-wash: #3A2F15; --bad: #EE8A78; --bad-wash: #432420;
  --photo: #22313A; --hatch: rgba(227, 233, 229, .06); --scrim: rgba(0, 0, 0, .6);
  --shadow-1: 0 1px 0 rgba(0,0,0,.3); --shadow-2: 0 1px 0 rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.7); --shadow-3: 0 24px 64px -20px rgba(0,0,0,.8);
}

/* ── base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
}
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
img { display: block; }
.shell { max-width: 1280px; margin: 0 auto; padding-inline: 32px; }

/* ── type roles ───────────────────────────────── */
.t-display { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4vw, 44px); line-height: 1.04; letter-spacing: -0.02em; font-variation-settings: "opsz" 96; }
.t-h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 3vw, 30px); line-height: 1.1; letter-spacing: -0.015em; }
.t-h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.2; letter-spacing: -0.01em; }
.t-h3 { font-weight: 600; font-size: 16px; line-height: 1.3; }
.t-body { font-size: 15px; line-height: 1.55; }
.t-small { font-size: 13px; line-height: 1.45; color: var(--ink-2); }
.t-micro, .label { font-family: var(--f-mono); font-size: 11px; line-height: 1.3; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 400; }
.t-num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.t-price { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 22px; letter-spacing: -0.02em; }
.t-score { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: -0.04em; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── title block + sheet index (tabs) ─────────── */
.titleblock { display: flex; flex-wrap: wrap; align-items: stretch; border: 1px solid var(--ink); border-top: 0; background: var(--sheet); }
.tb-name { flex: 1 1 320px; padding: 14px 20px; display: flex; align-items: center; gap: 14px; border-right: 1px solid var(--rule-2); min-width: 0; }
.tb-cell { flex: 0 1 auto; padding: 10px 18px; border-right: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 112px; }
.tb-cell:last-child { border-right: 0; }
.tb-val { font-family: var(--f-mono); font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tb-tools { flex-direction: row; align-items: center; min-width: 0; padding: 6px 8px; }
.wordmark { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; line-height: 1; margin: 0; }
.wordmark small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: 5px; line-height: 1.3; }
.benchmark { width: 34px; height: 34px; flex: none; color: var(--accent); }
.theme-ico .sun { display: none; }
:root[data-theme="dark"] .theme-ico .sun { display: block; } :root[data-theme="dark"] .theme-ico .moon { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-ico .sun { display: block; } :root:not([data-theme="light"]) .theme-ico .moon { display: none; } }

.tabs { position: sticky; top: 0; z-index: 20; background: var(--paper); margin-top: 20px; }
.tabs .shell { display: flex; align-items: stretch; gap: 0; }
.tabs .tl-wrap { display: flex; border-bottom: 1px solid var(--ink); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tab {
  appearance: none; border: 0; background: none; min-height: 48px; padding: 0 18px; display: inline-flex; align-items: center; gap: 9px;
  font-weight: 500; font-size: 15px; color: var(--ink-2); position: relative; white-space: nowrap; flex: none;
}
.tab .ico { display: none; width: 22px; height: 22px; }
.tab .no { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; background: var(--accent); }
.tab[aria-selected="true"] .no { color: var(--accent); }
.badge { font-family: var(--f-mono); font-size: 11px; background: var(--accent-wash); color: var(--accent); padding: 1px 6px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.badge:empty { display: none; }
.tabs .tools { display: flex; align-items: center; border-bottom: 1px solid var(--ink); padding-left: 8px; }

main { padding-block: 36px 96px; }

/* ── surfaces, headings ───────────────────────── */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r3); box-shadow: var(--shadow-1); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); margin-bottom: 20px; flex-wrap: wrap; }
.section-head .t-micro { color: var(--ink-2); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; padding-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { margin-top: 8px; }
.page-head .t-small { max-width: 60ch; }
section + section { margin-top: 56px; }

/* ── buttons, chips, toggles ──────────────────── */
.btn {
  appearance: none; min-height: 44px; padding: 0 16px; border-radius: var(--r2); border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 500; font-size: 14px; white-space: nowrap; text-decoration: none;
}
.btn:hover { border-color: var(--ink); }
.btn:disabled { opacity: .35; cursor: default; border-color: var(--rule-2); }
.btn-primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { border-color: var(--rule-2); }
.btn-icon { width: 44px; padding: 0; flex: none; }
.btn svg, .chip svg { width: 18px; height: 18px; flex: none; }
.chip {
  appearance: none; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--rule-2); background: var(--sheet); color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; position: relative;
}
.chip::after { content: ""; position: absolute; inset: -4px 0; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: var(--r2); overflow: hidden; background: var(--sheet); max-width: 100%; }
.seg button { appearance: none; border: 0; background: none; min-height: 40px; padding: 0 12px; font-size: 13px; font-weight: 500; color: var(--ink-2); border-right: 1px solid var(--rule); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); }
.field { min-height: 44px; border: 1px solid var(--rule-2); border-radius: var(--r2); background: var(--sheet); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--ink-3); font-size: 14px; min-width: 0; }
.field input, .field select { border: 0; background: transparent; font: inherit; color: var(--ink); outline: none; width: 100%; min-width: 0; padding: 0; min-height: 40px; }
.field:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
.field svg { width: 18px; height: 18px; flex: none; }
.field input[type=range] { accent-color: var(--accent); min-width: 90px; }

/* info tags (non-interactive) */
.tags { display: flex; flex-wrap: wrap; gap: 5px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border: 1px solid var(--rule); border-radius: var(--r1); font-size: 12px; font-weight: 500; color: var(--ink-2); background: var(--sheet); white-space: nowrap; }
.tag.good { background: var(--good-wash); border-color: transparent; color: var(--good); }
.tag.warn { background: var(--warn-wash); border-color: transparent; color: var(--warn); }
.tag.bad, .tag.neg { background: var(--bad-wash); border-color: transparent; color: var(--bad); }
.tag.pref { border-color: var(--accent); color: var(--accent); }
.tag.mine { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* form badge: footprint glyph, filled block = this unit */
.form { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 6px; border: 1px solid var(--rule-2); border-radius: var(--r1); background: var(--sheet); font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.fg { display: inline-flex; align-items: flex-end; height: 11px; flex: none; color: var(--ink); }
.fg i { width: 7px; height: 11px; border: 1.5px solid currentColor; display: block; }
.fg i:first-child { background: currentColor; }
.fg i + i { margin-left: -1.5px; }
.fg.detached i:nth-child(n+2) { display: none; }
.fg.semi i:nth-child(3), .fg.link i:nth-child(3) { display: none; }
.fg.link i + i { margin-left: 3px; height: 8px; }
.fg.link { border-bottom: 1.5px solid currentColor; height: 13px; }
.fg.mid i:first-child { background: none; } .fg.mid i:nth-child(2) { background: currentColor; }

/* estimate marker */
.est { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: var(--r1); border: 1px dashed var(--ink-3); font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); vertical-align: middle; font-weight: 400; font-style: normal; }

/* severity: shape + word + colour */
.sev { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px 0 6px; border-radius: var(--r1); font-size: 12px; font-weight: 600; white-space: nowrap; letter-spacing: 0; text-transform: none; font-family: var(--f-body); }
.sev::before { content: ""; width: 9px; height: 9px; flex: none; background: currentColor; }
.sev-good { color: var(--good); background: var(--good-wash); } .sev-good::before { border-radius: 50%; }
.sev-warn { color: var(--warn); background: var(--warn-wash); } .sev-warn::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); width: 10px; }
.sev-bad { color: var(--bad); background: var(--bad-wash); } .sev-bad::before { transform: rotate(45deg) scale(.85); }
.sev-none { color: var(--ink-2); background: var(--sheet-2); } .sev-none::before { background: none; border: 1.5px solid currentColor; border-radius: 50%; }

/* score: number + ten-segment survey scale */
.score { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; flex: none; }
.score-top { display: flex; align-items: baseline; gap: 6px; }
.score-top .of { font-family: var(--f-mono); font-size: 12px; color: var(--ink-3); }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 2px; height: 8px; width: 96px; }
.scale i { display: block; background: var(--rule); border-radius: 1px; }
.scale.good i.on { background: var(--good); } .scale.warn i.on { background: var(--warn); } .scale.bad i.on { background: var(--bad); }
.scale.good i.part { background: linear-gradient(90deg, var(--good) var(--p), var(--rule) 0); }
.scale.warn i.part { background: linear-gradient(90deg, var(--warn) var(--p), var(--rule) 0); }
.scale.bad i.part { background: linear-gradient(90deg, var(--bad) var(--p), var(--rule) 0); }
.band { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; white-space: nowrap; }
.band.good { color: var(--good); } .band.warn { color: var(--warn); } .band.bad { color: var(--bad); }
.seal { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 2px solid currentColor; font-family: var(--f-mono); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--sheet); flex: none; letter-spacing: -0.03em; }
.seal.good { color: var(--good); } .seal.warn { color: var(--warn); } .seal.bad { color: var(--bad); border-style: dashed; }
.seal.sm { width: 38px; height: 38px; font-size: 12px; border-width: 1.5px; }

/* criterion bars (0–10, ticks at 2.5 / 5 / 7.5) */
.bars { display: grid; gap: 7px; }
.bar { display: grid; grid-template-columns: 76px minmax(0, 1fr) 24px; align-items: center; gap: 10px; font-size: 12px; }
.bar .lbl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .lbl small { font-family: var(--f-mono); color: var(--ink-3); margin-left: 4px; }
.bar .trk {
  height: 6px; background: var(--sheet-2); position: relative; border-radius: 1px; box-shadow: inset 0 0 0 1px var(--rule);
  background-image: linear-gradient(90deg, transparent calc(25% - 1px), var(--rule-2) calc(25% - 1px), var(--rule-2) 25%, transparent 25%, transparent calc(50% - 1px), var(--rule-2) calc(50% - 1px), var(--rule-2) 50%, transparent 50%, transparent calc(75% - 1px), var(--rule-2) calc(75% - 1px), var(--rule-2) 75%, transparent 75%);
}
.bar .fil { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); border-radius: 1px; }
.bar .val { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; }
.bar.lo .fil { background: var(--bad); } .bar.lo .val { color: var(--bad); }
.bar.hi .fil { background: var(--good); }
.bars.wide .bar { grid-template-columns: 150px minmax(0, 1fr) 28px; font-size: 13px; }

/* photo slot */
.ph { position: relative; overflow: hidden; background-color: var(--photo); background-image: repeating-linear-gradient(135deg, var(--hatch) 0 1px, transparent 1px 9px); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .cap { position: absolute; left: 10px; bottom: 8px; font-family: var(--f-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); background: color-mix(in srgb, var(--sheet) 86%, transparent); padding: 2px 6px; border-radius: var(--r1); }
.rank { font-family: var(--f-mono); font-weight: 600; font-size: 12px; background: var(--ink); color: var(--paper); padding: 3px 7px; border-radius: var(--r1); line-height: 1.3; display: inline-block; }
.ph .rank { position: absolute; left: 10px; top: 10px; }
.ph .save { position: absolute; right: 8px; top: 8px; }
.save { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--sheet) 88%, transparent); color: var(--ink); padding: 0; flex: none; }
.save svg, .bm svg { width: 20px; height: 20px; }
[data-save][aria-pressed="true"] { color: var(--accent); }
[data-save][aria-pressed="true"] svg path { fill: currentColor; }
.btn-accent[data-save][aria-pressed="true"] { color: var(--accent-ink); }

/* listing card */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 20px; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r3); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-1); transition: box-shadow var(--t-med) var(--ease); cursor: pointer; min-width: 0; }
.card:hover { box-shadow: var(--shadow-2); }
.card .ph { aspect-ratio: 16 / 10; }
.card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.card-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.addr { font-family: var(--f-display); font-weight: 600; font-size: 19px; line-height: 1.15; letter-spacing: -0.01em; }
.hood { font-size: 13px; color: var(--ink-2); margin-top: 3px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.facts b { color: var(--ink); font-weight: 500; }
.lede-line { font-size: 13.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.pc { display: grid; gap: 4px; font-size: 13px; line-height: 1.4; padding: 0; list-style: none; }
.pc li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.pc .p::before { content: "+"; font-family: var(--f-mono); font-weight: 600; color: var(--good); }
.pc .c::before { content: "−"; font-family: var(--f-mono); font-weight: 600; color: var(--bad); }
.verdict { border-top: 1px dashed var(--rule-2); padding-top: 12px; display: grid; gap: 6px; font-size: 13px; margin-top: auto; }
.verdict .vh { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.nopics .card .ph { display: none; }
.card-head .rank { margin-bottom: 6px; }

/* pattern note */
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.note { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r3); padding: 18px 18px 20px; display: flex; flex-direction: column; gap: 8px; }
.note .n { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; color: var(--accent); }
.note h3 { font-size: 15px; font-weight: 600; line-height: 1.3; font-family: var(--f-body); }
.note p { font-size: 13px; color: var(--ink-2); line-height: 1.45; }

/* shortlist intro */
.intro { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 32px 56px; align-items: end; padding: 12px 0 44px; }

.intro .facts { margin-top: 16px; font-size: 13px; }
.keybox { padding: 16px 18px; display: grid; gap: 12px; }
.keygrid { display: grid; grid-template-columns: 120px 1fr; gap: 10px 14px; align-items: center; font-size: 13px; color: var(--ink-2); }

/* table */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--r3); background: var(--sheet); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { position: sticky; top: 0; background: var(--sheet-2); text-align: left; font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); padding: 0 12px; height: 42px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; user-select: none; }
.tbl th[data-sort] { cursor: pointer; }
.tbl th[data-sort]:hover { color: var(--ink); }
.tbl th.r, .tbl td.r { text-align: right; }
.tbl th[aria-sort] { color: var(--ink); }
.tbl th .arr { color: var(--accent); margin-left: 4px; }
.tbl td { padding: 8px 12px; height: 60px; border-bottom: 1px solid var(--rule); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl td.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tbl tbody tr[data-open] { cursor: pointer; }
.tbl tbody tr[data-open]:hover td { background: color-mix(in srgb, var(--accent-wash) 45%, transparent); }
.tbl .home-cell { display: flex; gap: 12px; align-items: center; white-space: normal; min-width: 220px; }
.tbl .thumb { width: 56px; height: 40px; border-radius: var(--r2); flex: none; }
.tbl .a { font-weight: 600; line-height: 1.25; }
.tbl .h { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
.tbl th:focus-visible { outline-offset: -2px; }
.bm { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--ink-3); padding: 0; border-radius: var(--r2); }
.bm:hover { color: var(--ink); background: var(--sheet-2); }

/* listings filters */

.filters .grow { flex: 1 1 240px; }

.filters .toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.sortf, .fbtn { display: none; }
.fx { display: contents; }
.note-line { font-size: 13px; color: var(--ink-2); margin: 0 0 12px; }
.lcs { display: none; gap: 10px; }
.lc { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r3); cursor: pointer; }
.lc .ph { width: 92px; height: 92px; border-radius: var(--r2); }
.lc .ph .rank { left: 6px; top: 6px; font-size: 11px; }
.lc .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.lc .row { flex-wrap: nowrap; margin: -8px 0; }
.lc .nm { font-weight: 600; font-size: 15px; line-height: 1.25; }
.nopics .lc { grid-template-columns: minmax(0, 1fr); }
.nopics .lc .ph, .nopics .tbl .thumb { display: none; }
.cmpbar { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(16px + var(--nav-h) + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100% - 24px)); padding: 6px 6px 6px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: var(--shadow-2); border-color: var(--ink); font-size: 14px; }
.empty { border: 1px dashed var(--rule-2); border-radius: var(--r3); padding: 40px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; background: color-mix(in srgb, var(--sheet) 60%, transparent); color: var(--ink-2); }
.empty svg { width: 56px; height: 56px; color: var(--ink-3); }
.empty h3 { color: var(--ink); font-size: 16px; }

/* compare */
.cmp { min-width: 640px; }
.cmp th, .cmp td { white-space: normal; vertical-align: top; height: auto; padding: 12px 16px; min-width: 180px; }
.cmp thead th { position: static; text-transform: none; letter-spacing: 0; font: inherit; color: var(--ink); background: var(--sheet); border-bottom: 1px solid var(--ink); border-left: 1px solid var(--rule); }
.cmp thead th:first-child { border-left: 0; }
.cmp tbody th { position: sticky; left: 0; z-index: 1; background: var(--sheet); font-family: var(--f-body); font-size: 13px; letter-spacing: 0; text-transform: none; color: var(--ink-2); font-weight: 400; min-width: 130px; width: 150px; }
.cmp td { border-left: 1px solid var(--rule); font-size: 14px; }
.cmp tr.grp th { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 22px; border-bottom: 1px solid var(--ink); background: var(--sheet); }
.cmp tr.grp td { border-left: 0; border-bottom: 1px solid var(--ink); padding: 0; }
.cmp td.bestc { background: color-mix(in srgb, var(--good-wash) 70%, transparent); }
.best { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--good); margin-left: 6px; font-weight: 600; white-space: nowrap; }
.cmp .ch { display: grid; gap: 10px; }

.cmp .ch .ph .save { width: 36px; height: 36px; top: 6px; right: 6px; }
.cmp .ch .addrb { background: none; border: 0; padding: 0; text-align: left; font-family: var(--f-display); font-weight: 600; font-size: 17px; line-height: 1.2; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.cmp .big { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 500; }
.cmp .bar { grid-template-columns: minmax(0, 1fr) 24px; }
.list { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; }
.list.flags li::marker { color: var(--bad); } .list.good li::marker { color: var(--good); }
.cmp .list { font-size: 13px; }

/* map */
.mapwrap { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 20px; align-items: start; }
.maplist { display: flex; flex-direction: column; overflow: hidden; position: sticky; top: 64px; max-height: calc(100vh - 88px); }
.ml-head { padding: 14px 14px 12px; border-bottom: 1px solid var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.ml-body { overflow: auto; }
.mrow { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--rule); min-height: 60px; width: 100%; background: none; text-align: left; }
.mrow:hover { background: color-mix(in srgb, var(--accent-wash) 45%, transparent); }
.mrow .nm { font-weight: 600; font-size: 14px; line-height: 1.25; }
.mapbox { position: relative; padding: 0; overflow: hidden; min-width: 0; }
.mapbox svg { display: block; }
.legend-box { padding: 10px 14px; display: grid; gap: 6px; font-size: 12px; border-radius: 0; border-width: 1px 0 0; box-shadow: none; }
.legend-box .lg { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--ink-2); }
.legend-box .lg span { display: inline-flex; gap: 6px; align-items: center; }
.lgd { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
svg .gl { stroke: var(--rule); stroke-width: 1; }
svg .gl0, svg .axl { stroke: var(--rule-2); stroke-width: 1; }
svg text { font: 10.5px var(--f-mono); fill: var(--ink-3); }
svg text.strong { fill: var(--ink); font-weight: 600; }
svg text.maplab { paint-order: stroke; stroke: var(--sheet); stroke-width: 3.5px; stroke-linejoin: round; pointer-events: none; letter-spacing: .08em; }
svg text.pn { text-anchor: middle; font-weight: 600; font-size: 11px; pointer-events: none; }
.pin.good { fill: var(--good); stroke: var(--sheet); stroke-width: 2; } text.pn.good { fill: var(--sheet); }
.pin.warn { fill: var(--sheet); stroke: var(--warn); stroke-width: 2; } text.pn.warn { fill: var(--warn); }
.pin.bad { fill: var(--sheet); stroke: var(--bad); stroke-width: 2; stroke-dasharray: 3 2; } text.pn.bad { fill: var(--bad); }
.d-good { fill: var(--good); } .d-warn { fill: var(--warn); } .d-bad { fill: var(--bad); }
.d-acc { fill: var(--accent); } .d-mute { fill: var(--ink-3); }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.dot { cursor: pointer; }
svg .dot:focus { outline: none; } svg .dot:focus-visible { outline: none; stroke: var(--accent); stroke-width: 3; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: var(--r2); padding: 8px 10px; font: 12px/1.4 var(--f-mono); max-width: 260px; z-index: 50; box-shadow: var(--shadow-2); }

/* market */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
.kpi { padding: 16px 18px; display: grid; gap: 4px; border-right: 1px solid var(--rule); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 26px; letter-spacing: -.03em; }
.charts { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
.chart { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r3); padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.chart-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.chart-head h3 { font-size: 15px; font-weight: 600; font-family: var(--f-body); }
.chart-head p { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; max-width: 62ch; }
.chart svg { display: block; overflow: visible; }
.chart .src { font-size: 11px; color: var(--ink-3); font-family: var(--f-mono); display: flex; justify-content: space-between; border-top: 1px solid var(--rule); padding-top: 8px; gap: 12px; flex-wrap: wrap; }
.scroll { overflow-x: auto; max-width: 100%; }
.mtbl td, .mtbl th { height: 44px; }

/* report */
.report { display: grid; grid-template-columns: 200px minmax(0, 720px); gap: 56px; justify-content: center; }
.toc { position: sticky; top: 72px; display: grid; gap: 2px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; }
.toc a { display: grid; grid-template-columns: 24px 1fr; gap: 6px; min-height: 40px; align-items: center; font-size: 13.5px; line-height: 1.3; color: var(--ink-2); text-decoration: none; border-left: 2px solid var(--rule); padding: 4px 0 4px 12px; }
.toc a:hover { color: var(--ink); }
.toc a[aria-current="true"] { color: var(--ink); border-left-color: var(--accent); font-weight: 600; }
.toc a span { font-family: var(--f-mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }
.read { font-family: var(--f-read); font-size: 18px; line-height: 1.62; color: var(--ink); font-variation-settings: "opsz" 20; min-width: 0; }
.read p, .read li { max-width: 68ch; }
.read p + p, .read ul, .read ol, .read p + .scroll, .read .scroll + p { margin-top: 1em; }
.read ul, .read ol { padding-left: 1.3em; display: grid; gap: .35em; }
.read h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4vw, 44px); line-height: 1.06; letter-spacing: -0.02em; margin: 0 0 22px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); }
.read h2 { font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.15; letter-spacing: -0.015em; margin: 1.8em 0 .55em; scroll-margin-top: 72px; }
.read h3 { font-family: var(--f-body); font-weight: 600; font-size: 17px; margin: 1.6em 0 .4em; }
.read blockquote { margin: 1.4em 0; padding: 4px 0 4px 20px; border-left: 2px solid var(--accent); font-style: italic; color: var(--ink-2); }
.read b, .read strong { font-weight: 600; }
.read code { font-family: var(--f-mono); font-size: .82em; font-variant-numeric: tabular-nums; }
.read hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
.read .scroll { border: 1px solid var(--rule); border-radius: var(--r3); background: var(--sheet); }
.read table { border-collapse: collapse; font-family: var(--f-body); font-size: 13px; line-height: 1.4; width: 100%; }
.read th, .read td { padding: 8px 10px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: top; }
.read tbody tr:last-child td { border-bottom: 0; }
.read th { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); background: var(--sheet-2); border-bottom: 1px solid var(--rule-2); white-space: nowrap; }

/* drawer */
#scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; }
#drawer { position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--sheet); box-shadow: var(--shadow-3); border-left: 1px solid var(--rule-2); overflow-y: auto; overscroll-behavior: contain; padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-reduced-motion: no-preference) { #drawer:not([hidden]) { animation: slide var(--t-med) var(--ease); } }
@keyframes slide { from { transform: translateX(32px); opacity: .5; } to { transform: none; opacity: 1; } }
.drawer-bar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px 24px; border-bottom: 1px solid var(--rule); min-height: 60px; background: var(--sheet); }
.drawer-bar .t-micro { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dnav { display: flex; gap: 4px; align-items: center; }
.dnav .sep { width: 1px; height: 24px; background: var(--rule); margin: 0 4px; }
.drawer-body { padding: 24px 28px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; }
.drawer-body > * { min-width: 0; }
.dhead { display: flex; justify-content: space-between; gap: 16px 24px; align-items: flex-start; }
.dhead h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 4vw, 30px); line-height: 1.1; letter-spacing: -0.015em; }
.dhead .t-price { font-size: 28px; }
.dhead .t-score { font-size: 52px; }
.dhead .scale { width: 130px; }
.gal .main { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--photo); border-radius: var(--r3); }
.gal .strip { display: flex; gap: 4px; margin-top: 6px; overflow-x: auto; padding-bottom: 2px; }
.gal .strip button { padding: 0; border: 2px solid transparent; background: none; flex: 0 0 auto; border-radius: var(--r2); overflow: hidden; }
.gal .strip button[aria-current="true"] { border-color: var(--accent); }
.gal .strip img { width: 84px; height: 60px; object-fit: cover; }
.gal .cap { margin-top: 6px; }
.dsec > h3 { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 500; padding-bottom: 8px; border-bottom: 1px solid var(--ink); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.dsec > h3 .r { color: var(--ink-3); }
.specs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border: 1px solid var(--rule); border-radius: var(--r3); overflow: hidden; background: var(--sheet); }
.specs > div { padding: 10px 12px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); margin: 0 -1px -1px 0; min-width: 0; }
.specs .v { font: 500 14px/1.35 var(--f-mono); margin-top: 3px; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.specs .v small { display: block; font: 400 11.5px/1.35 var(--f-body); color: var(--ink-2); margin-top: 2px; }
.callout { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; font-size: 15px; line-height: 1.55; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.sub { color: var(--ink-2); font-size: 13.5px; }
.finding { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px 12px; padding: 11px 0; border-bottom: 1px solid var(--rule); font-size: 14px; align-items: start; }
.finding:last-child { border-bottom: 0; }
.finding .sev { justify-self: start; }
details.fold { border-top: 1px solid var(--rule); padding: 4px 0; }
details.fold summary { cursor: pointer; font-weight: 500; font-size: 14px; min-height: 40px; display: flex; align-items: center; }
details.fold[open] summary { margin-bottom: 8px; }
details.fold > p { font-size: 14px; color: var(--ink-2); max-width: 68ch; margin-bottom: 8px; }
.lot svg { width: 100%; max-width: 420px; height: auto; display: block; }
.lot .lotfill { fill: var(--accent-wash); stroke: var(--accent); stroke-width: 1.5; }
.caveat { font-size: 12.5px; color: var(--ink-2); max-width: 68ch; }
.pbox { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.pbox > * { min-width: 0; }
/* value range: band = estimate, ▼ = ask */
.prange { position: relative; height: 60px; margin: 6px 8px 0; }
.prange .trk { position: absolute; left: 0; right: 0; top: 28px; height: 1px; background: var(--rule-2); }
.prange .band { position: absolute; top: 22px; height: 13px; background: var(--accent-wash); border: 1px solid var(--accent); border-radius: 2px; }
.prange .mk { position: absolute; top: 16px; width: 0; height: 25px; border-left: 2px solid var(--ink); transform: translateX(-1px); }
.prange .mk.ask::before { content: ""; position: absolute; left: -7px; top: -9px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 9px solid var(--ink); }
.prange .mk.mid { border-left-color: var(--accent); }
.prange .mk.wa { border-left: 2px dashed var(--good); }
.prange .mk span { position: absolute; top: -14px; left: 0; transform: translateX(-50%); font: 500 10.5px/1 var(--f-mono); white-space: nowrap; color: var(--ink-2); }
.prange .mk.ask span { top: -22px; color: var(--ink); font-weight: 600; }
.dtab { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.dtab th { text-align: left; font: 500 10.5px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule-2); }
.dtab td { padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.dtab td.r, .dtab th.r { text-align: right; font-family: var(--f-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dtab tr.tot td { font-weight: 600; border-bottom: 0; border-top: 1px solid var(--ink); }
.links { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ── narrower screens ─────────────────────────── */
@media (max-width: 1100px) {
  .tb-cell.opt { display: none; }
  .intro { grid-template-columns: 1fr; }
  .mapwrap { grid-template-columns: minmax(0, 1fr); }
  .maplist { position: static; max-height: 420px; order: 2; }
  .report { grid-template-columns: minmax(0, 720px); }
  .toc { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(2) { border-right: 0; } .kpi:nth-child(-n+2) { border-bottom: 1px solid var(--rule); }
}
@media (max-width: 720px) {
  :root { --nav-h: 64px; }
  .shell { padding-inline: 16px; }
  body { font-size: 15.5px; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); }
  .titleblock { border-left: 0; border-right: 0; margin-inline: -16px; }
  .tb-name { padding: 10px 8px 10px 16px; border-right: 0; flex-basis: 0; }
  .tb-cell { display: none; } .tb-cell.tb-tools { display: flex; border-right: 0; }
  .benchmark { width: 28px; height: 28px; }
  .wordmark { font-size: 19px; }
  .tabs { position: fixed; top: auto; bottom: 0; left: 0; right: 0; margin: 0; background: var(--sheet); border-top: 1px solid var(--ink); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 30; }
